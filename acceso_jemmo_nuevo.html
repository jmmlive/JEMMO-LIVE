<button id="loginTab" class="hot" aria-label="Iniciar sesión" onclick="closeRegister()"></button>
<button id="registerTab" class="hot" aria-label="Registrarse" onclick="openRegister()"></button>
<input id="email" type="email" autocomplete="email" aria-label="Correo electrónico">
<input id="password" type="password" autocomplete="current-password" aria-label="Contraseña">
<button id="forgot" class="hot" aria-label="Olvidaste tu contraseña" onclick="forgotPassword()"></button>
<button id="enter" class="hot" aria-label="Entrar" onclick="enterApp()"></button>
<button id="google" class="hot" aria-label="Google" onclick="social('Google')"></button>
<button id="apple" class="hot" aria-label="Apple" onclick="social('Apple')"></button>
<button id="facebook" class="hot" aria-label="Facebook" onclick="social('Facebook')"></button>
<div id="toast" class="toast"></div>
<div id="registerModal" class="modal"><form class="sheet" onsubmit="createAccount(event)">
<h2>Crear cuenta</h2><input id="name" placeholder="Nombre artístico" required><input id="regEmail" type="email" placeholder="Correo electrónico" required>
<input id="regPassword" type="password" placeholder="Contraseña" minlength="6" required><input id="country" placeholder="País" required>
<button class="create">REGISTRARME</button><button type="button" class="close" onclick="closeRegister()">VOLVER</button>
</form></div></main>
<script>
const toast=document.getElementById('toast');
function message(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3000)}
function openRegister(){document.getElementById('registerModal').classList.add('show')}function closeRegister(){document.getElementById('registerModal').classList.remove('show')}
function enterApp(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;if(!e||!p)return message('Escribe tu correo y contraseña.');localStorage.setItem('jemmo_logged','yes');localStorage.setItem('jemmo_email',e);location.href='index.html'}
function forgotPassword(){const e=document.getElementById('email').value.trim();message(e?'Recuperación preparada para '+e:'Escribe primero tu correo electrónico.')}
function social(provider){message('Acceso con '+provider+' preparado para conectar.')}
function createAccount(ev){ev.preventDefault();localStorage.setItem('jemmo_logged','yes');localStorage.setItem('jemmo_name',document.getElementById('name').value);localStorage.setItem('jemmo_email',document.getElementById('regEmail').value);localStorage.setItem('jemmo_country',document.getElementById('country').value);location.href='index.html'}
</script></body></html>
