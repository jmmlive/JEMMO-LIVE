<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050008"><title>MI PERFIL | JEMMO LIVE</title><link rel="stylesheet" href="jemmo.css"></head><body><main class="app"><div data-top="MI PERFIL"></div>

<dialog id="dlg"><h3>Editar perfil</h3><label>Nombre artístico</label><input id="ename"><label>Emoji/avatar demo</label><input id="eav" maxlength="4"><div class="actions"><button class="btn primary" onclick="saveP()">GUARDAR</button><button class="btn soft" onclick="dlg.close()">CANCELAR</button></div></dialog>
<script>function draw(){const p=J.profile();av.textContent=p.avatar;pn.textContent=p.name;pid.textContent=p.id;lv.textContent=p.level;fol.textContent=p.following;fans.textContent=p.fans;likes.textContent=p.likes}function edit(){const p=J.profile();ename.value=p.name;eav.value=p.avatar;dlg.showModal()}function saveP(){J.setProfile({name:ename.value||'Usuario JEMMO',avatar:eav.value||'🐟'});dlg.close();draw();J.toast('Perfil guardado en esta demo local')}draw()</script></main><div data-nav="perfil"></div><div id="toast" class="toast"></div><script src="jemmo.js"></script></body></html>
