<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05030a"><title>Casas · JEMMO LIVE</title><link rel="stylesheet" href="casas.css"></head><body><div class="app">
<header class="top"><button class="icon" id="menuBtn">☰</button><div class="brand"><strong id="topName">Casa Unicornio</strong><span id="topMotto">Familia · Unidad · Fuerza</span></div><button class="wallet" id="walletBtn"><small>MONEDERO</small><b>🟡 125,680</b></button></header>

<div class="section-title section"><h2>Chat de la Casa</h2><button id="clearChat">Limpiar</button></div><section class="chatbox"><div class="tabs"><button class="tab on">Casa</button><button class="tab">Global</button><button class="tab">Avisos</button></div><div class="messages" id="messages"></div><div class="composer"><input id="chatInput" placeholder="Escribe un mensaje..."><button class="send" id="sendBtn">➤</button></div></section>
<nav class="bottom"><button onclick="location.href='index.html'"><b>⌂</b>Inicio</button><button id="navOnline"><b>◉</b>Explorar</button><button class="on"><b>⌂</b>Casas</button><button onclick="location.href='mensajes.html'"><b>✉</b>Mensajes</button><button onclick="location.href='yo.html'"><b>●</b>Perfil</button></nav>
</div>
<div class="drawer" id="drawer"><div class="drawer-card"><h2>JEMMO LIVE</h2><p style="color:#aaa3b4">Centro de la cuenta</p><button class="drawer-item">Mi perfil</button><button class="drawer-item">Monedero</button><button class="drawer-item">Notificaciones</button><button class="drawer-item">Ayuda y soporte</button><button class="drawer-item">Configuración</button><button class="drawer-item" id="closeDrawer">Cerrar menú</button></div></div>

<div class="sheet" id="profileSheet"><div class="sheet-card" id="profileContent"></div></div>
<div class="toast" id="toast"></div><script src="casas-data.js"></script><script src="casas.js"></script></body></html>
