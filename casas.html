<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JEMMO LIVE · Casas</title><link rel="stylesheet" href="jemmo-house.css"></head><body><div class="app"><header class="topbar"><button class="icon" onclick="location.href='index.html'">←</button><div class="house-title"><h1>Casas JEMMO</h1><p>Elige una comunidad</p></div><div class="wallet"><b>ABIERTAS</b>10</div></header><main class="houses-page"><section class="hero"><h2>El edificio de las comunidades</h2><p>Busca una Casa, toca su escudo y entra directamente a su salón.</p><input id="q" class="search" style="margin-top:14px" placeholder="Buscar Casa..." oninput="draw()"></section><section id="list" class="houses-grid"></section></main></div><nav class="bottom-nav"><a href="index.html"><b>⌂</b>INICIO</a><a href="salas.html"><b>◉</b>SALAS</a><a class="active" href="casas.html"><b>◇</b>CASAS</a><a href="mensajes.html"><b>✉</b>MENSAJES</a><a href="yo.html"><b>○</b>YO</a></nav><div id="toast" class="toast"></div><script src="jemmo-data.js"></script><script src="app.js"></script><script>function draw(){const s=(q.value||'').toLowerCase();const arr=JEMMO_HOUSES.filter(h=>h.name.toLowerCase().includes(s));list.innerHTML=arr.map(h=>`<button class="house-card" style="--hc:${h.color};--ha:${h.accent}" onclick="setHouse('${h.id}');location.href='casa.html?id=${h.id}'"><div class="crest">${h.tag}</div><h3>${h.name}</h3><p>${h.motto}</p><div class="meta"><span>${h.online} dentro</span><span>Nivel ${h.level}</span></div></button>`).join('')}draw()</script></body></html>
