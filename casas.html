<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JEMMO LIVE · Casas</title><link rel="stylesheet" href="jemmo.css"></head><body><div class="app"><header class="topbar"><button class="icon" onclick="location.href='index.html'">←</button><div class="brand"><b>CASAS</b> JEMMO</div><div class="wallet"><b>ABIERTAS</b>10</div></header><main><section class="hero"><h1>El edificio de las comunidades</h1><p>Aquí eliges la Casa que quieres visitar. Al tocar una, entrarás directamente en su salón.</p><input id="q" class="search" style="margin-top:16px" placeholder="Buscar Casa..." oninput="draw()"></section><div class="section-head"><h2>Casas disponibles</h2><span id="count"></span></div><div class="grid2" id="list"></div></main></div><nav class="bottom-nav"><a href="index.html"><b>⌂</b>INICIO</a><a href="#" onclick="toast('LIVE')"><b>◉</b>LIVE</a><a class="active" href="casas.html"><b>◇</b>CASAS</a><a href="#" onclick="toast('Mensajes')"><b>✉</b>MENSAJES</a><a href="#" onclick="toast('Perfil')"><b>○</b>YO</a></nav><div id="toast" class="toast"></div><script src="jemmo-data.js"></script><script src="app.js"></script><script>function draw(){const s=(q.value||'').toLowerCase();const arr=JEMMO_HOUSES.filter(h=>h.name.toLowerCase().includes(s));count.textContent=arr.length;list.innerHTML=arr.map(h=>`<article class="house-card" style="--hc:${h.color};--ha:${h.accent}" onclick="saveHouse('${h.id}');location.href='casa.html?id=${h.id}'"><div class="crest">${h.tag}</div><h3>${h.name}</h3><p>${h.motto}</p><div class="mini-row"><span><i class="online-dot"></i>${h.online} dentro</span><span>Nivel ${h.level}</span></div></article>`).join('')}draw()</script></body></html>
