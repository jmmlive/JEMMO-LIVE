<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05050b">
<title>Acceso · JEMMO LIVE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#05050b;--card:rgba(18,18,34,.78);--line:rgba(153,88,255,.28);--gold:#ffd21f;--violet:#a000ff;--text:#fff;--muted:#aaa8bd}
body{min-height:100svh;font-family:Inter,Arial,sans-serif;color:var(--text);background:
radial-gradient(circle at 50% -10%,rgba(137,0,255,.23),transparent 34%),
radial-gradient(circle at 8% 70%,rgba(0,167,255,.12),transparent 28%),
var(--bg);display:flex;align-items:center;justify-content:center;padding:22px;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(30px);opacity:.35;pointer-events:none}
.o1{width:160px;height:160px;background:#6d00ff;top:7%;right:-70px}
.o2{width:140px;height:140px;background:#ffc400;bottom:4%;left:-90px}
.shell{width:min(100%,430px);position:relative}
.logo-card{background:rgba(0,0,0,.64);border:1px solid rgba(255,210,31,.18);border-radius:30px;padding:20px 14px 16px;box-shadow:0 22px 70px rgba(0,0,0,.55),0 0 35px rgba(120,0,255,.12);backdrop-filter:blur(18px);margin-bottom:16px}
.logo{display:block;width:100%;height:auto;border-radius:18px}
.welcome{text-align:center;margin:4px 0 18px}
.welcome h1{font-size:25px;letter-spacing:.2px}
.welcome p{color:var(--muted);font-size:14px;margin-top:7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 20px 55px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(22px)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:rgba(255,255,255,.04);padding:5px;border-radius:18px;margin-bottom:18px}
.tab{border:0;border-radius:14px;padding:13px 8px;background:transparent;color:#aaa8bd;font-weight:800;font-size:15px}
.tab.active{color:#111;background:linear-gradient(135deg,#ffd91f,#ffb800);box-shadow:0 8px 24px rgba(255,194,0,.2)}
.form{display:none} .form.active{display:block}
.field{margin-bottom:13px}
label{display:block;color:#d7d5e4;font-size:13px;font-weight:700;margin:0 0 7px 4px}
input{width:100%;border:1px solid rgba(255,255,255,.11);outline:none;background:rgba(5,5,14,.72);color:white;border-radius:17px;padding:15px 16px;font-size:16px;transition:.2s}
input:focus{border-color:#a936ff;box-shadow:0 0 0 4px rgba(169,54,255,.11)}
.primary{width:100%;border:0;border-radius:18px;padding:16px;margin-top:5px;font-size:16px;font-weight:900;color:white;background:linear-gradient(135deg,#8b00ff,#c000ff 55%,#ffb900);box-shadow:0 12px 30px rgba(132,0,255,.28)}
.note{text-align:center;color:#85839a;font-size:12px;line-height:1.5;margin-top:14px}
.back{display:block;text-align:center;color:#c7c4d5;text-decoration:none;font-size:14px;font-weight:700;margin-top:16px}
.brandline{height:2px;width:80px;margin:15px auto 0;border-radius:9px;background:linear-gradient(90deg,transparent,#ffd21f,#9d00ff,transparent)}
</style>
</head>

  <div class="welcome">
    <h1>Tu mundo empieza aquí</h1>
    <p>Conecta, crea y vive el momento.</p>
  </div>

  <section class="card">
    <div class="tabs">
      <button class="tab active" onclick="showForm('login',this)">Entrar</button>
      <button class="tab" onclick="showForm('register',this)">Crear cuenta</button>
    </div>

    <form id="login" class="form active" onsubmit="demo(event)">
      <div class="field"><label>Correo electrónico</label><input type="email" placeholder="tu@correo.com" required></div>
      <div class="field"><label>Contraseña</label><input type="password" placeholder="Tu contraseña" required></div>
      <button class="primary" type="submit">Entrar en JEMMO</button>
      <p class="note">Acceso seguro a tu perfil y comunidad.</p>
    </form>

    <form id="register" class="form" onsubmit="demo(event)">
      <div class="field"><label>Nombre o nombre artístico</label><input type="text" placeholder="¿Cómo quieres que te conozcan?" required></div>
      <div class="field"><label>Correo electrónico</label><input type="email" placeholder="tu@correo.com" required></div>
      <div class="field"><label>Contraseña</label><input type="password" minlength="6" placeholder="Mínimo 6 caracteres" required></div>
      <button class="primary" type="submit">Crear mi cuenta</button>
      <p class="note">Al continuar, entrarás en la experiencia JEMMO LIVE.</p>
    </form>
  </section>

<script>
function showForm(id,btn){
  document.querySelectorAll('.form').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active'); btn.classList.add('active');
}
function demo(e){e.preventDefault();alert('Vista preparada. La conexión real de cuentas será el siguiente paso.');}
</script>
