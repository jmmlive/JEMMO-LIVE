
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#120018">
  <title>JEMMO LIVE · Acceso</title>
  <link rel="stylesheet" href="jemmo.css">
</head>
<body class="access-page">
  <main class="access-wrap">
    <section class="access-card">
      <div class="tabs">
        <button id="tabLogin" class="tab active">INICIAR SESIÓN</button>
        <button id="tabRegister" class="tab">REGISTRARSE</button>
      </div>

      <form id="authForm" novalidate>
        <label id="nameField" class="field hidden">
          <span class="icon">◉</span>
          <input id="name" type="text" placeholder="Nombre" autocomplete="name">
        </label>

        <label class="field">
          <span class="icon">✉</span>
          <input id="email" type="email" placeholder="Correo electrónico" autocomplete="email" required>
        </label>

        <label class="field">
          <span class="icon">◆</span>
          <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" minlength="6" required>
          <button id="togglePassword" type="button" class="eye" aria-label="Mostrar contraseña">◐</button>
        </label>

        <button id="forgot" type="button" class="forgot">¿Olvidaste tu contraseña?</button>
        <p id="status" class="status" aria-live="polite"></p>

        <button id="submitBtn" type="submit" class="primary">ENTRAR</button>
      </form>

      <div class="separator"><span></span><p>o continúa con</p><span></span></div>

      <div class="socials">
        <button type="button" disabled>Google</button>
        <button type="button" disabled>Apple</button>
        <button type="button" disabled>Facebook</button>
      </div>

      <p class="legal">
        Al continuar aceptas nuestros <a href="#">Términos y condiciones</a>
        y la <a href="#">Política de privacidad</a>.
      </p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile,
      sendPasswordResetEmail,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyBK0-3RnU5JVx3hI_DoM9Bj2efnk3N4nBQ",
  authDomain: "jemmo-live.firebaseapp.com",
  projectId: "jemmo-live",
  storageBucket: "jemmo-live.firebasestorage.app",
  messagingSenderId: "355540892255",
  appId: "1:355540892255:web:d15a8dd03b2915e31939ea",
  measurementId: "G-8C6NJ0KM4Y"
};


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence).catch(console.error);

    let mode = "login";
    const tabLogin = document.querySelector("#tabLogin");
    const tabRegister = document.querySelector("#tabRegister");
    const nameField = document.querySelector("#nameField");
    const forgot = document.querySelector("#forgot");
    const submitBtn = document.querySelector("#submitBtn");
    const form = document.querySelector("#authForm");
    const status = document.querySelector("#status");
    const password = document.querySelector("#password");
    const togglePassword = document.querySelector("#togglePassword");

    function setMode(next) {
      mode = next;
      const isLogin = mode === "login";
      tabLogin.classList.toggle("active", isLogin);
      tabRegister.classList.toggle("active", !isLogin);
      nameField.classList.toggle("hidden", isLogin);
      forgot.classList.toggle("hidden", !isLogin);
      submitBtn.textContent = isLogin ? "ENTRAR" : "CREAR CUENTA";
      password.autocomplete = isLogin ? "current-password" : "new-password";
      status.textContent = "";
      status.className = "status";
    }

    function friendly(code) {
      return {
        "auth/invalid-credential": "Correo o contraseña incorrectos.",
        "auth/invalid-email": "El correo no es válido.",
        "auth/email-already-in-use": "Ese correo ya está registrado.",
        "auth/weak-password": "La contraseña debe tener al menos 6 caracteres.",
        "auth/too-many-requests": "Demasiados intentos. Prueba más tarde.",
        "auth/network-request-failed": "No hay conexión o el dominio aún no está autorizado."
      }[code] || "No se pudo completar la operación.";
    }

    tabLogin.addEventListener("click", () => setMode("login"));
    tabRegister.addEventListener("click", () => setMode("register"));

    togglePassword.addEventListener("click", () => {
      const visible = password.type === "text";
      password.type = visible ? "password" : "text";
      togglePassword.textContent = visible ? "◐" : "●";
    });

    forgot.addEventListener("click", async () => {
      const email = document.querySelector("#email").value.trim();
      if (!email) {
        status.textContent = "Escribe primero tu correo.";
        status.className = "status error";
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        status.textContent = "Correo de recuperación enviado.";
        status.className = "status success";
      } catch (error) {
        status.textContent = friendly(error.code);
        status.className = "status error";
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      status.textContent = "Conectando…";
      status.className = "status";

      const email = document.querySelector("#email").value.trim();
      const pass = password.value;
      const name = document.querySelector("#name").value.trim();

      try {
        if (mode === "login") {
          await signInWithEmailAndPassword(auth, email, pass);
        } else {
          const result = await createUserWithEmailAndPassword(auth, email, pass);
          if (name) await updateProfile(result.user, { displayName: name });
        }
        location.href = "index.html";
      } catch (error) {
        status.textContent = friendly(error.code);
        status.className = "status error";
      } finally {
        submitBtn.disabled = false;
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) location.href = "index.html";
    });
  </script>
</body>
</html>
