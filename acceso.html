el id="confirmField" class="field hidden"><span>🔒</span><input id="confirm" type="password" placeholder="Confirmar contraseña"></label><button id="forgot" class="forgot" type="button">¿Olvidaste tu contraseña?</button><label id="legal" class="check hidden"><input id="accept" type="checkbox"> Acepto términos y privacidad.</label><p id="status" class="status" role="status" aria-live="polite"></p><button id="retryAuth" class="retry-auth hidden" type="button">REINTENTAR</button><button id="submit" class="primary" type="submit">ENTRAR</button></form><div class="separator"><span></span><b>o continúa con</b><span></span></div><div class="socials"><button id="googleLogin" type="button"><span class="google-mark">G</span><span>Continuar con Google</span></button></div><p class="social-note">Apple y Facebook se activarán cuando sus proveedores estén configurados correctamente.</p><button class="install-app" data-install-jemmo type="button" hidden>⬇ INSTALAR JEMMO LIVE</button><section class="benefits"><article><strong>⭐</strong><span>Transmite<br>en vivo</span></article><article><strong>👥</strong><span>Conecta<br>con amigos</span></article><article><strong>💎</strong><span>Gana<br>recompensas</span></article><article><strong>👑</strong><span>Sé una<br>estrella</span></article></section><footer><div>🐟</div><b>JEMMO LIVE</b><small>V1 · Corrección Global 01</small></footer></section></main><script src="pwa-register.js"></script><script type="module">
/* JEMMO LIVE V1 · ACCESO ESTABLE PRUEBA 04
   Corrección limitada al acceso: almacenamiento seguro, persistencia tolerante
   y desbloqueo garantizado del botón cuando Firebase o el navegador no responden. */
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getAuth, setPersistence, browserLocalPersistence, browserSessionPersistence, inMemoryPersistence, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, sendPasswordResetEmail, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';

const firebaseConfig = {
  apiKey: 'AIzaSyBK0-3RnU5JVx3hI_DoM9Bj2efnk3N4nBQ',
  authDomain: 'jemmo-live.firebaseapp.com',
  projectId: 'jemmo-live',
  storageBucket: 'jemmo-live.firebasestorage.app',
  messagingSenderId: '355540892255',
  appId: '1:355540892255:web:d15a8dd03b2915e31939ea'
};
const app = getApps()[0] || initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = selector => document.querySelector(selector);
const status = $('#status');
const submit = $('#submit');
const retryAuth = $('#retryAuth');

function safeStorageGet(storage, key) {
  try { return storage.getItem(key); }
  catch (error) { console.warn(`JEMMO storage get ${key}:`, error); return null; }
}
function safeStorageSet(storage, key, value) {
  try { storage.setItem(key, value); return true; }
  catch (error) { console.warn(`JEMMO storage set ${key}:`, error); return false; }
}
function safeStorageRemove(storage, key) {
  try { storage.removeItem(key); }
  catch (error) { console.warn(`JEMMO storage remove ${key}:`, error); }
}
function withTimeout(promise, milliseconds, code = 'auth/request-timeout') {
  let timer = 0;
  const timeout = new Promise((_, reject) => {
    timer = window.setTimeout(() => {
      const error = new Error('La conexión con Firebase tardó demasiado.');
      error.code = code;
      reject(error);
    }, milliseconds);
  });
  return Promise.race([promise, timeout]).finally(() => window.clearTimeout(timer));
}

let mode = safeStorageGet(sessionStorage, 'jemmo_access_mode') || 'login';
let busy = false;
let navigating = false;

const friendlyError = error => {
  const code = error?.code || '';
  if (code.includes('request-timeout')) return 'La conexión tardó demasiado. Revisa Internet y pulsa Reintentar.';
  if (code.includes('network-request-failed')) return 'No se pudo conectar con el servidor. Revisa Wi‑Fi, datos o VPN y pulsa Reintentar. Tus datos siguen escritos.';
  if (code.includes('web-storage-unsupported')) return 'El navegador bloqueó el almacenamiento. Cierra y abre JEMMO LIVE y pulsa Reintentar.';
  if (code.includes('email-already-in-use')) return 'Ese correo ya tiene una cuenta. Pulsa Iniciar sesión.';
  if (code.includes('invalid-email')) return 'El correo electrónico no es válido.';
  if (code.includes('weak-password')) return 'La contraseña debe tener al menos 6 caracteres.';
  if (code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return 'Correo o contraseña incorrectos.';
  if (code.includes('too-many-requests')) return 'Demasiados intentos. Espera unos minutos y vuelve a probar.';
  if (code.includes('operation-not-allowed')) return 'Este método de acceso todavía no está activado en Firebase.';
  return error?.message || 'No se pudo completar la operación.';
};

function message(text, kind='') {
  status.textContent = text;
  status.className = 'status ' + kind;
  retryAuth.classList.toggle('hidden', !text.toLocaleLowerCase('es').includes('reintentar'));
}

function setBusy(value) {
  busy = value;
  submit.disabled = value;
  submit.setAttribute('aria-busy', value ? 'true' : 'false');
  $('#googleLogin').disabled = value;
  submit.textContent = value ? 'CONECTANDO…' : (mode === 'login' ? 'ENTRAR' : 'CREAR CUENTA');
}

function setMode(next) {
  mode = next;
  safeStorageSet(sessionStorage, 'jemmo_access_mode', mode);
  const login = mode === 'login';
  $('#tabLogin').classList.toggle('active', login);
  $('#tabRegister').classList.toggle('active', !login);
  $('#registerFields').classList.toggle('hidden', login);
  $('#confirmField').classList.toggle('hidden', login);
  $('#legal').classList.toggle('hidden', login);
  $('#forgot').classList.toggle('hidden', !login);
  submit.textContent = login ? 'ENTRAR' : 'CREAR CUENTA';
  message('');
}

function saveFields() {
  const data = { name: $('#name').value, birthDate: $('#birthDate').value, gender: $('#gender').value, email: $('#email').value };
  safeStorageSet(sessionStorage, 'jemmo_access_fields', JSON.stringify(data));
}
function restoreFields() {
  try {
    const data = JSON.parse(safeStorageGet(sessionStorage, 'jemmo_access_fields') || '{}');
    for (const id of ['name','birthDate','gender','email']) if (data[id]) $('#' + id).value = data[id];
  } catch (error) {
    console.warn('JEMMO restaurar acceso:', error);
  }
}
function storeAuthenticatedUid(uid) {
  const value = String(uid || '');
  if (!value) return;
  if (!safeStorageSet(localStorage, 'jemmo_active_uid', value)) {
    safeStorageSet(sessionStorage, 'jemmo_active_uid', value);
  }
}
function enterApp(user) {
  if (!user?.uid || navigating) return;
  navigating = true;
  storeAuthenticatedUid(user.uid);
  safeStorageRemove(sessionStorage, 'jemmo_access_fields');
  location.replace('inicio.html');
}

try {
  await withTimeout(setPersistence(auth, browserLocalPersistence), 6000, 'auth/persistence-timeout');
} catch (error) {
  console.warn('JEMMO persistencia local no disponible:', error);
  try {
    await setPersistence(auth, browserSessionPersistence);
  } catch (sessionError) {
    console.warn('JEMMO persistencia de sesión:', sessionError);
    try { await setPersistence(auth, inMemoryPersistence); }
    catch (fallbackError) { console.warn('JEMMO persistencia temporal:', fallbackError); }
  }
}

restoreFields();
setMode(mode);
['name','birthDate','gender','email'].forEach(id => $('#' + id).addEventListener('input', saveFields));
$('#tabLogin').addEventListener('click', () => setMode('login'));
$('#tabRegister').addEventListener('click', () => setMode('register'));
$('#toggle').addEventListener('click', () => { $('#password').type = $('#password').type === 'password' ? 'text' : 'password'; });

$('#forgot').addEventListener('click', async () => {
  const email = $('#email').value.trim();
  if (!email) return message('Escribe primero tu correo.', 'error');
  try {
    await withTimeout(sendPasswordResetEmail(auth, email), 20000);
    message('Correo de recuperación enviado.', 'success');
  } catch (error) {
    message(friendlyError(error), 'error');
  }
});

async function submitEmail() {
  if (busy || navigating) return;
  const email = $('#email').value.trim();
  const password = $('#password').value;
  if (!email || !password) return message('Escribe el correo y la contraseña.', 'error');

  setBusy(true);
  message('');
  saveFields();
  try {
    let result;
    if (mode === 'login') {
      result = await withTimeout(signInWithEmailAndPassword(auth, email, password), 25000);
    } else {
      const name = $('#name').value.trim();
      const birthDate = $('#birthDate').value;
      const gender = $('#gender').value;
      if (!name || !birthDate || !gender) throw new Error('Completa todos los datos.');
      if (password !== $('#confirm').value) throw new Error('Las contraseñas no coinciden.');
      if (!$('#accept').checked) throw new Error('Debes aceptar los términos y la privacidad.');
      result = await withTimeout(createUserWithEmailAndPassword(auth, email, password), 25000);
      await withTimeout(updateProfile(result.user, { displayName: name }), 15000);
      await withTimeout(setDoc(doc(db, 'users', result.user.uid), { displayName: name, email, birthDate, gender, role: 'usuario', createdAt: serverTimestamp() }, { merge: true }), 20000);
    }
    enterApp(result.user);
  } catch (error) {
    console.error('JEMMO auth:', error);
    message(friendlyError(error), 'error');
  } finally {
    if (!navigating) setBusy(false);
  }
}

$('#authForm').addEventListener('submit', event => { event.preventDefault(); submitEmail(); });
retryAuth.addEventListener('click', submitEmail);
$('#googleLogin').addEventListener('click', async () => {
  if (busy || navigating) return;
  setBusy(true);
  message('Abriendo Google…');
  try {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    await withTimeout(signInWithRedirect(auth, provider), 25000);
  } catch (error) {
    message(friendlyError(error), 'error');
    setBusy(false);
  }
});

try {
  const redirectResult = await withTimeout(getRedirectResult(auth), 20000);
  if (redirectResult?.user) enterApp(redirectResult.user);
} catch (error) {
  message(friendlyError(error), 'error');
  setBusy(false);
}

let initial = true;
const revealAccess = () => {
  document.documentElement.classList.remove('jemmo-access-pending');
  document.documentElement.classList.add('jemmo-access-ready');
};
onAuthStateChanged(auth, user => {
  if (initial && user) {
    enterApp(user);
    return;
  }
  initial = false;
  revealAccess();
}, error => {
  console.error('JEMMO auth state:', error);
  const localUid = safeStorageGet(localStorage, 'jemmo_active_uid') || safeStorageGet(sessionStorage, 'jemmo_active_uid');
  if (localUid) location.replace('inicio.html?sesion=local');
  else revealAccess();
});
window.setTimeout(() => {
  if (!document.documentElement.classList.contains('jemmo-access-pending')) return;
  const localUid = safeStorageGet(localStorage, 'jemmo_active_uid') || safeStorageGet(sessionStorage, 'jemmo_active_uid');
  if (localUid) location.replace('inicio.html?sesion=local');
  else revealAccess();
}, 5000);

window.addEventListener('offline', () => {
  if (!navigating) setBusy(false);
  message('Sin conexión. Tus datos no se perderán; vuelve a intentarlo cuando tengas red.', 'error');
});
window.addEventListener('online', () => {
  if (status.textContent.startsWith('Sin conexión')) message('Conexión recuperada. Pulsa Reintentar.', 'success');
});
</script></body></html>
