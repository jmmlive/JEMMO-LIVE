<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08000d">
  <title>JEMMO LIVE · Acceso</title>
  <link rel="stylesheet" href="acceso.css">
</head>
<body>
  <main class="page">
    <section class="access-shell">
      <img class="official-header" src="assets/cabecera-oficial-jemmo.jpg" alt="Mascota y logotipo oficial de JEMMO LIVE">

      <section class="panel">
        <div class="tabs" role="tablist">
          <button id="tabLogin" class="tab active" type="button">👤 INICIAR SESIÓN</button>
          <button id="tabRegister" class="tab" type="button">🧑‍🤝‍🧑 REGISTRARSE</button>
        </div>

        <form id="authForm" novalidate>
          <div id="registerFields" class="register-fields hidden">
            <label class="field">
              <span>👤</span>
              <input id="name" type="text" placeholder="Nombre de usuario" autocomplete="name">
            </label>

            <div class="two-cols">
              <label class="field">
                <span>🎂</span>
                <input id="birthDate" type="date" aria-label="Fecha de nacimiento">
              </label>
              <label class="field">
                <span>⚧</span>
                <select id="gender" aria-label="Sexo">
                  <option value="">Sexo</option>
                  <option value="mujer">Mujer</option>
                  <option value="hombre">Hombre</option>
                  <option value="otro">Otro</option>
                  <option value="prefiero-no-decirlo">Prefiero no decirlo</option>
                </select>
              </label>
            </div>
          </div>

          <label class="field">
            <span>✉</span>
            <input id="email" type="email" placeholder="Correo electrónico" autocomplete="email" required>
          </label>

          <label class="field">
            <span>🔒</span>
            <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" minlength="6" required>
            <button id="togglePassword" class="eye" type="button" aria-label="Mostrar contraseña">◉</button>
          </label>

          <label id="confirmField" class="field hidden">
            <span>🔒</span>
            <input id="confirmPassword" type="password" placeholder="Confirmar contraseña" autocomplete="new-password">
          </label>

          <button id="forgot" type="button" class="forgot">¿Olvidaste tu contraseña?</button>

          <label id="legalField" class="check hidden">
            <input id="acceptLegal" type="checkbox">
            <span>Acepto los Términos y la Política de privacidad.</span>
          </label>

          <p id="status" class="status" aria-live="polite"></p>
          <button id="submitBtn" class="primary" type="submit">ENTRAR</button>
        </form>

        <div class="separator"><span></span><b>o continúa con</b><span></span></div>

        <div class="socials" aria-label="Acceso social">
          <button type="button" disabled title="Próximamente">G</button>
          <button type="button" disabled title="Próximamente">●</button>
          <button type="button" disabled title="Próximamente">f</button>
        </div>

        <section class="benefits">
          <article><strong>⭐</strong><span>Transmite<br>en vivo</span></article>
          <article><strong>👥</strong><span>Conecta<br>con amigos</span></article>
          <article><strong>💎</strong><span>Gana<br>recompensas</span></article>
          <article><strong>👑</strong><span>Sé una<br>estrella</span></article>
        </section>

        <footer>
          <div class="mini-fish">🐟</div>
          <b>JEMMO LIVE</b>
          <small>Versión 1.0.0</small>
        </footer>
      </section>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth, setPersistence, browserLocalPersistence,
      signInWithEmailAndPassword, createUserWithEmailAndPassword,
      updateProfile, sendPasswordResetEmail, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, doc, setDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBK0-3RnU5JVx3hI_DoM9Bj2efnk3N4nBQ",
      authDomain: "jemmo-live.firebaseapp.com",
      projectId: "jemmo-live",
      storageBucket: "jemmo-live.firebasestorage.app",
      messagingSenderId: "355540892255",
      appId: "1:355540892255:web:d15a8dd03b2915e31939ea",
      measurementId: "G-8C6NJ0KM4Y"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    setPersistence(auth, browserLocalPersistence).catch(console.error);

    let mode = "login";
    const $ = (s) => document.querySelector(s);
    const tabLogin = $("#tabLogin");
    const tabRegister = $("#tabRegister");
    const registerFields = $("#registerFields");
    const confirmField = $("#confirmField");
    const legalField = $("#legalField");
    const forgot = $("#forgot");
    const submitBtn = $("#submitBtn");
    const password = $("#password");
    const confirmPassword = $("#confirmPassword");
    const status = $("#status");

    function setStatus(message = "", type = "") {
      status.textContent = message;
      status.className = `status ${type}`.trim();
    }

    function setMode(next) {
      mode = next;
      const login = next === "login";
      tabLogin.classList.toggle("active", login);
      tabRegister.classList.toggle("active", !login);
      registerFields.classList.toggle("hidden", login);
      confirmField.classList.toggle("hidden", login);
      legalField.classList.toggle("hidden", login);
      forgot.classList.toggle("hidden", !login);
      submitBtn.textContent = login ? "ENTRAR" : "CREAR CUENTA";
      password.autocomplete = login ? "current-password" : "new-password";
      setStatus();
    }

    function friendly(code) {
      return ({
        "auth/invalid-credential": "Correo o contraseña incorrectos.",
        "auth/invalid-email": "El correo no es válido.",
        "auth/email-already-in-use": "Ese correo ya está registrado.",
        "auth/weak-password": "La contraseña debe tener al menos 6 caracteres.",
        "auth/too-many-requests": "Demasiados intentos. Prueba más tarde.",
        "auth/network-request-failed": "No hay conexión o el dominio todavía no está autorizado."
      })[code] || "No se pudo completar la operación.";
    }

    tabLogin.addEventListener("click", () => setMode("login"));
    tabRegister.addEventListener("click", () => setMode("register"));

    $("#togglePassword").addEventListener("click", () => {
      const visible = password.type === "text";
      password.type = visible ? "password" : "text";
      confirmPassword.type = visible ? "password" : "text";
    });

    forgot.addEventListener("click", async () => {
      const email = $("#email").value.trim();
      if (!email) return setStatus("Escribe primero tu correo.", "error");
      try {
        await sendPasswordResetEmail(auth, email);
        setStatus("Correo de recuperación enviado.", "success");
      } catch (error) {
        setStatus(friendly(error.code), "error");
      }
    });

    $("#authForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      submitBtn.disabled = true;
      setStatus("Conectando…");

      const email = $("#email").value.trim();
      const pass = password.value;

      try {
        if (mode === "login") {
          await signInWithEmailAndPassword(auth, email, pass);
        } else {
          const name = $("#name").value.trim();
          const birthDate = $("#birthDate").value;
          const gender = $("#gender").value;
          const confirm = confirmPassword.value;
          const legal = $("#acceptLegal").checked;

          if (!name || !birthDate || !gender) throw new Error("Completa todos los datos de registro.");
          if (pass !== confirm) throw new Error("Las contraseñas no coinciden.");
          if (!legal) throw new Error("Debes aceptar los términos y la privacidad.");

          const result = await createUserWithEmailAndPassword(auth, email, pass);
          await updateProfile(result.user, { displayName: name });
          await setDoc(doc(db, "users", result.user.uid), {
            displayName: name,
            email,
            birthDate,
            gender,
            createdAt: serverTimestamp()
          });
        }
        location.href = "index.html";
      } catch (error) {
        setStatus(error.code ? friendly(error.code) : error.message, "error");
      } finally {
        submitBtn.disabled = false;
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) location.href = "index.html";
    });
  </script>
</body>
</html>
