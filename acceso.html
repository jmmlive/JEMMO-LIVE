<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050008"><title>JEMMO LIVE | Acceso</title>
<style>
:root{--gold:#ffcc2f;--violet:#c62dff;--deep:#07000d;--muted:#c9b8d3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050008;color:#fff;font-family:Inter,Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 10% 8%,#51106f 0,transparent 24%),radial-gradient(circle at 90% 24%,#7d126f55 0,transparent 24%),radial-gradient(circle at 50% 50%,#4d086b55 0,transparent 36%),linear-gradient(180deg,#09000f,#030005)}
.access{width:min(100%,720px);min-height:100vh;margin:auto;padding:28px 20px 42px;position:relative;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(40px);pointer-events:none}.g1{width:170px;height:170px;background:#b200ff55;left:-100px;top:35%}.g2{width:150px;height:150px;background:#ffc52b33;right:-100px;top:10%}
.logo{text-align:center;position:relative;z-index:1;padding-top:10px}
.fish{width:92px;height:58px;margin:auto;position:relative;transform:rotate(-8deg)}
.fish:before{content:"";position:absolute;inset:7px 10px 7px 0;border-radius:55% 45% 48% 52%;background:radial-gradient(circle at 68% 30%,#7ceaff 0 5%,#10151d 6% 9%,transparent 10%),linear-gradient(145deg,#f15cff,#8716ca 52%,#30034d);box-shadow:0 0 28px #c12dff88}
.fish:after{content:"J";position:absolute;left:29px;top:18px;color:var(--gold);font:italic 900 21px Georgia;text-shadow:0 0 10px #ffcb2d}
.logo h1{margin:0;font-size:42px;letter-spacing:1px}.logo h1 i{font:italic 900 54px Georgia;color:var(--gold);text-shadow:0 0 18px #ffbd1f88}.logo h1 span{color:#d83cff;text-shadow:0 0 20px #9b00ff}.live{display:inline-flex;border:1px solid #ffc52b99;border-radius:999px;padding:5px 15px;color:var(--gold);font-weight:900;letter-spacing:5px}
.tag{margin:18px 0 4px;font-size:17px}.tag b:nth-child(2){color:#d94cff}.tag b:nth-child(3){color:var(--gold)}
.welcome{color:#dac9e3;font-size:11px;letter-spacing:2px;text-transform:uppercase}
.panel{position:relative;z-index:1;margin-top:25px;padding:17px;border:1px solid #a52adf88;border-radius:30px;background:linear-gradient(180deg,rgba(39,6,58,.78),rgba(12,2,21,.9));backdrop-filter:blur(18px);box-shadow:0 20px 60px #0009,0 0 32px #8d00c733}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tab{border:0;border-radius:17px;padding:14px 8px;background:transparent;color:#cdb4d8;font-weight:900}.tab.on{background:linear-gradient(135deg,#7612c7,#cf2eff);color:#fff;box-shadow:0 0 20px #a400ff55}
.form{display:none}.form.on{display:block}
.field{position:relative;margin:10px 0}.field svg{position:absolute;left:16px;top:16px;width:21px;height:21px;fill:none;stroke:#d65cff;stroke-width:1.8}.field input{width:100%;height:54px;border:1px solid #633079;border-radius:17px;background:#0b0313;color:#fff;padding:0 48px;font-size:16px;outline:none}.field input:focus{border-color:#ce36ff;box-shadow:0 0 17px #9c00ff44}
.eye{position:absolute;right:8px;top:7px;width:40px;height:40px;border:0;background:none;color:#d8bce4}
.forgot{display:block;margin-left:auto;border:0;background:none;color:#dc65ff;padding:6px 2px 10px}
.primary{width:100%;padding:16px;border:0;border-radius:17px;background:linear-gradient(100deg,#ffca25,#ffd65b 48%,#bd20ff);color:#18001e;font-size:19px;font-weight:1000;box-shadow:0 0 25px #c026ff44}
.divider{display:flex;align-items:center;gap:10px;color:#9f8aaa;font-size:12px;margin:18px 0}.divider:before,.divider:after{content:"";height:1px;background:#5a286b;flex:1}
.socials{display:flex;justify-content:center;gap:16px}.social{width:51px;height:51px;border-radius:50%;border:1px solid #8f2db8;background:#11041c;color:#fff;font-size:20px;font-weight:900;box-shadow:0 0 18px #8e00ff33}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.feature{text-align:center;padding:10px 3px;border:1px solid #67247e;border-radius:17px;background:#10031a;color:#d8c6e1;font-size:9px}.feature svg{width:23px;height:23px;fill:none;stroke:var(--gold);stroke-width:1.8}.feature b{display:block;color:var(--gold);font-size:10px;margin-top:5px}
.msg{display:none;margin:10px 0;padding:12px;border-radius:14px;background:#241039;color:#f3dfff;text-align:center}.msg.show{display:block}
@media(max-width:380px){.access{padding-top:18px}.logo h1{font-size:35px}.logo h1 i{font-size:46px}.tag{font-size:15px}.panel{margin-top:18px}.features{margin-top:12px}}
</style></head><body><main class="access"><div class="glow g1"></div><div class="glow g2"></div>
<section class="logo"><div class="fish"></div><h1><i>J</i><span>EMMO</span></h1><div class="live">LIVE ▶</div><div class="tag"><b>Tu mundo.</b> <b>Tu escenario.</b> <b>Tu familia.</b></div><div class="welcome">Bienvenido a JEMMO LIVE</div></section>
<section class="panel">
<div class="tabs"><button id="loginTab" class="tab on" onclick="show('login')">INICIAR SESIÓN</button><button id="registerTab" class="tab" onclick="show('register')">REGISTRARSE</button></div>
<form id="login" class="form on" onsubmit="enter(event)">
<div class="field"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3z"/><path d="m3 6 9 7 9-7"/></svg><input id="email" type="email" placeholder="Correo electrónico" autocomplete="email" required></div>
<div class="field"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" minlength="6" required><button class="eye" type="button" onclick="togglePass()">◉</button></div>
<button class="forgot" type="button" onclick="forgot()">¿Olvidaste tu contraseña?</button><div id="msg" class="msg"></div><button class="primary">ENTRAR</button>
<div class="divider">o continúa con</div><div class="socials"><button class="social" type="button" onclick="social('Google')">G</button><button class="social" type="button" onclick="social('Apple')">●</button><button class="social" type="button" onclick="social('Facebook')">f</button></div>
</form>
<form id="register" class="form" onsubmit="register(event)">
<div class="field"><input id="name" placeholder="Nombre artístico" required></div><div class="field"><input id="regEmail" type="email" placeholder="Correo electrónico" required></div><div class="field"><input id="regPassword" type="password" placeholder="Contraseña" minlength="6" required></div><div class="field"><input id="country" placeholder="País" required></div><button class="primary">CREAR CUENTA</button>
</form>
<div class="features">
<div class="feature"><svg viewBox="0 0 24 24"><path d="M8 12a4 4 0 1 0 8 0"/><path d="M5 9a8 8 0 0 0 14 6"/><path d="M12 16v5"/></svg><b>Transmite</b>en vivo</div>
<div class="feature"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2"/><path d="M3 20c1-5 3-7 6-7s5 2 6 7"/><path d="M15 15c3 0 5 2 6 5"/></svg><b>Conecta</b>con amigos</div>
<div class="feature"><svg viewBox="0 0 24 24"><path d="m12 3 7 5-7 13L5 8z"/><path d="M5 8h14"/></svg><b>Gana</b>recompensas</div>
<div class="feature"><svg viewBox="0 0 24 24"><path d="m3 7 4 4 5-7 5 7 4-4-2 11H5z"/></svg><b>Sé una</b>estrella</div>
</div></section></main>
<script>
function show(x){document.querySelectorAll('.form,.tab').forEach(e=>e.classList.remove('on'));document.getElementById(x).classList.add('on');document.getElementById(x+'Tab').classList.add('on')}
function message(t){msg.textContent=t;msg.classList.add('show');clearTimeout(window.mt);window.mt=setTimeout(()=>msg.classList.remove('show'),3200)}
function togglePass(){password.type=password.type==='password'?'text':'password'}
function enter(e){e.preventDefault();localStorage.setItem('jemmo_logged','yes');localStorage.setItem('jemmo_email',email.value.trim());location.href='index.html'}
function register(e){e.preventDefault();localStorage.setItem('jemmo_logged','yes');localStorage.setItem('jemmo_name',name.value.trim());localStorage.setItem('jemmo_email',regEmail.value.trim());localStorage.setItem('jemmo_country',country.value.trim());localStorage.setItem('jemmo_profile',JSON.stringify({name:name.value.trim(),user:'@'+name.value.trim().toLowerCase().replace(/\s+/g,''),bio:'',country:country.value.trim()}));location.href='index.html'}
function forgot(){message(email.value.trim()?'Hemos preparado la recuperación para '+email.value.trim():'Escribe primero tu correo electrónico.')}
function social(n){message('Acceso con '+n+' disponible al conectar autenticación.')}
</script></body></html>
