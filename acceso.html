<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090511">
  <title>Acceso · JEMMO LIVE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: white;
      background:
        linear-gradient(rgba(5,2,12,.42), rgba(5,2,12,.58)),
        url("assets/jemmo-background.png") center/cover no-repeat fixed;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    .panel {
      width: min(520px, 100%);
      padding: 34px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 28px;
      background: rgba(14,8,25,.62);
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: clamp(34px, 8vw, 62px); }
    p { color: rgba(255,255,255,.7); line-height: 1.55; }
    a {
      display: inline-flex;
      margin-top: 16px;
      padding: 13px 19px;
      border-radius: 999px;
      color: white;
      text-decoration: none;
      background: linear-gradient(135deg, rgba(157,77,255,.76), rgba(255,189,73,.42));
      border: 1px solid rgba(255,255,255,.17);
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Acceso</h1>
    <p>Página temporal de acceso. Después conectaremos el formulario y la identidad definitiva.</p>
    <a href="index.html">← Volver al inicio</a>
  </main>
</body>
</html>
