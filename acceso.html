<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07000d">
<title>Acceso | JEMMO LIVE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050008;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh;background:
linear-gradient(180deg,transparent 0 45%,rgba(5,0,8,.35) 58%,#050008 100%),
url("assets/acceso_jemmo.png") center top/cover no-repeat fixed}
.wrap{min-height:100vh;display:flex;align-items:flex-end;justify-content:center;padding:58vh 18px 34px}
.panel{width:min(100%,520px);padding:18px;border:1px solid rgba(191,39,255,.55);border-radius:26px;background:rgba(8,2,19,.88);backdrop-filter:blur(13px);box-shadow:0 0 35px rgba(151,0,255,.35)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tab{padding:14px;border:0;border-radius:17px;background:transparent;color:#f1c8ff;font-weight:900}
.tab.active{background:linear-gradient(90deg,#7900ff,#d31fff);box-shadow:0 0 20px #9c00ff99}
.form{display:none}.form.active{display:block}
input{width:100%;padding:16px;margin:7px 0;border:1px solid #55366d;border-radius:15px;background:#0b0615;color:#fff;outline:none}
input:focus{border-color:#c323ff;box-shadow:0 0 14px #8e00ff55}
.primary{width:100%;padding:16px;margin-top:10px;border:0;border-radius:16px;background:linear-gradient(90deg,#ffc21b,#ffd35e,#b716ff);color:#16001f;font-size:19px;font-weight:1000}
.note{text-align:center;color:#d8c7e6;font-size:13px;margin:13px 0 0}
</style>
</head>
<body>
<div class="wrap"><section class="panel">
<div class="tabs">
<button id="loginTab" class="tab active" onclick="showForm('login')">INICIAR SESIÓN</button>
<button id="registerTab" class="tab" onclick="showForm('register')">REGISTRARSE</button>
</div>
<form id="login" class="form active" onsubmit="login(event)">
<input id="email" type="email" placeholder="Correo electrónico" required>
<input id="password" type="password" placeholder="Contraseña" required minlength="6">
<button class="primary">ENTRAR</button>
</form>
<form id="register" class="form" onsubmit="register(event)">
<input id="name" placeholder="Nombre artístico" required>
<input id="regEmail" type="email" placeholder="Correo electrónico" required>
<input id="regPassword" type="password" placeholder="Contraseña" required minlength="6">
<input id="country" placeholder="País" required>
<button class="primary">CREAR CUENTA</button>
</form>
<p class="note">Tu mundo. Tu escenario. Tu familia.</p>
</section></div>
<script>
if(localStorage.getItem("jemmo_logged")==="yes") location.replace("index.html");
function showForm(type){
 document.querySelectorAll(".form,.tab").forEach(x=>x.classList.remove("active"));
 document.getElementById(type).classList.add("active");
 document.getElementById(type+"Tab").classList.add("active");
}
function login(e){
 e.preventDefault();
 localStorage.setItem("jemmo_logged","yes");
 localStorage.setItem("jemmo_email",document.getElementById("email").value);
 location.replace("index.html");
}
function register(e){
 e.preventDefault();
 localStorage.setItem("jemmo_logged","yes");
 localStorage.setItem("jemmo_name",document.getElementById("name").value);
 localStorage.setItem("jemmo_email",document.getElementById("regEmail").value);
 localStorage.setItem("jemmo_country",document.getElementById("country").value);
 location.replace("index.html");
}
</script>
</body>
</html>
