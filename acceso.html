.panel{
  width:min(100%,560px);margin:0 auto;
  background:var(--panel);border:1px solid rgba(191,48,255,.65);
  border-radius:28px;padding:20px;
  backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
  box-shadow:0 0 38px rgba(145,0,255,.38);
}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:15px}
.tab{border:0;border-radius:17px;padding:15px 8px;background:transparent;color:#f4dbff;font-weight:900}
.tab.active{background:linear-gradient(90deg,#7a00ff,#d21fff);box-shadow:0 0 20px rgba(157,0,255,.55)}
.form{display:none}.form.active{display:block}
.field{width:100%;padding:16px;margin:7px 0;border-radius:16px;border:1px solid #65417d;background:#0c0618;color:#fff;outline:none;font-size:16px}
.field:focus{border-color:#cf2cff;box-shadow:0 0 15px rgba(166,0,255,.45)}
.forgot{width:100%;border:0;background:transparent;color:#e26cff;text-align:right;padding:8px 2px 10px}
.primary{width:100%;padding:16px;border:0;border-radius:16px;background:linear-gradient(90deg,var(--gold),#ffd76d,var(--violet));font-size:20px;font-weight:1000;color:#17001f}
.social-title{display:flex;align-items:center;gap:10px;margin:18px 0 13px;color:#ddd}
.social-title:before,.social-title:after{content:"";height:1px;background:#5a4168;flex:1}
.socials{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.social{border:1px solid #744097;border-radius:17px;padding:12px;background:#10051f;color:#fff;font-weight:800}
.legal{margin:17px 4px 0;text-align:center;color:#c7b6d3;font-size:12px;line-height:1.5}
.legal button{border:0;background:transparent;color:#d86cff;padding:0 3px}
.toast{display:none;margin:10px 0 0;padding:11px;border-radius:13px;background:#241039;color:#f3dfff;text-align:center}
.toast.show{display:block}
</style>
</head>
<body>
<main class="screen">
  <section class="panel">
    <div class="tabs">
      <button id="loginTab" class="tab active" onclick="showForm('login')">INICIAR SESIÓN</button>
      <button id="registerTab" class="tab" onclick="showForm('register')">REGISTRARSE</button>
    </div>

    <form id="login" class="form active" onsubmit="login(event)">
      <input id="email" class="field" type="email" placeholder="Correo electrónico" autocomplete="email" required>
      <input id="password" class="field" type="password" placeholder="Contraseña" autocomplete="current-password" minlength="6" required>
      <button type="button" class="forgot" onclick="forgotPassword()">¿Olvidaste tu contraseña?</button>
      <button class="primary">ENTRAR</button>

      <div class="social-title">o continúa con</div>
      <div class="socials">
        <button type="button" class="social" onclick="social('Google')">Google</button>
        <button type="button" class="social" onclick="social('Apple')">Apple</button>
        <button type="button" class="social" onclick="social('Facebook')">Facebook</button>
      </div>
    </form>

    <form id="register" class="form" onsubmit="register(event)">
      <input id="name" class="field" placeholder="Nombre artístico" required>
      <input id="regEmail" class="field" type="email" placeholder="Correo electrónico" required>
      <input id="regPassword" class="field" type="password" placeholder="Contraseña" minlength="6" required>
      <input id="country" class="field" placeholder="País" required>
      <button class="primary">CREAR CUENTA</button>
    </form>

    <div id="toast" class="toast"></div>

    <p class="legal">
      Al continuar aceptas nuestros
      <button onclick="legal('Términos y condiciones')">Términos y condiciones</button>
      y la
      <button onclick="legal('Política de privacidad')">Política de privacidad</button>.
    </p>
  </section>
</main>

<script>
const toast = document.getElementById('toast');

function notify(text) {
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function showForm(type) {
  document.querySelectorAll('.form,.tab').forEach(el => el.classList.remove('active'));
  document.getElementById(type).classList.add('active');
  document.getElementById(type + 'Tab').classList.add('active');
}

function login(event) {
  event.preventDefault();
  localStorage.setItem('jemmo_logged','yes');
  localStorage.setItem('jemmo_email',document.getElementById('email').value);
  location.href='index.html';
}

function register(event) {
  event.preventDefault();
  localStorage.setItem('jemmo_logged','yes');
  localStorage.setItem('jemmo_name',document.getElementById('name').value);
  localStorage.setItem('jemmo_email',document.getElementById('regEmail').value);
  localStorage.setItem('jemmo_country',document.getElementById('country').value);
  location.href='index.html';
}

function forgotPassword() {
  const email = document.getElementById('email').value.trim();
  notify(email ? 'Recuperación preparada para ' + email : 'Escribe primero tu correo electrónico.');
}

function social(provider) {
  notify('Acceso con ' + provider + ' preparado para conectar.');
}

function legal(section) {
  notify(section + ': apartado preparado para enlazar.');
}
</script>
</body>
</html>
