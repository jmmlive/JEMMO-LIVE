<div class="toast" id="toast"></div><script src="jemmo.js"></script><script>
let s=getState();count.textContent=s.messages.length+' conversaciones';
list.innerHTML=s.messages.map((m,i)=>`<article class="card" onclick="openChat(${i})" style="cursor:pointer"><div style="display:flex;justify-content:space-between"><b>${m.from}</b><small class="muted">${m.time}</small></div><p class="muted">${m.text}</p><span class="pill">Abrir chat</span></article>`).join('');
function openChat(i){let m=s.messages[i];let text=prompt('Mensaje para '+m.from);if(!text)return;m.text='Tú: '+text;m.time='Ahora';saveState(s);toastMsg('Mensaje guardado');setTimeout(()=>location.reload(),450)}
</script></body></html>
