<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050008"><title>REPORTAR | JEMMO LIVE</title><link rel="stylesheet" href="jemmo.css"></head><body><main class="app"><div data-top="REPORTAR"></div>
<div class="wrap"><section class="card hero"><div class="eyebrow">SEGURIDAD JEMMO</div><h1>Reportar 🚨</h1><p>Describe el problema con claridad. En esta V1 el reporte se guarda en el almacenamiento local del dispositivo para probar el flujo.</p></section><form class="card form-card" onsubmit="sendReport(event)"><label>Tipo de problema</label><select id="type"><option>Contenido</option><option>Acoso o amenazas</option><option>Menor en riesgo</option><option>Fraude o regalos</option><option>Suplantación</option><option>Problema de privacidad</option><option>Otro</option></select><label>Usuario, LIVE o Casa</label><input id="target" placeholder="Nombre, ID o enlace interno"><label>Qué ocurrió</label><textarea id="detail" required minlength="10" placeholder="Cuéntanos qué pasó..."></textarea><label><input id="urgent" type="checkbox" style="width:auto"> Creo que existe riesgo inmediato para una persona</label><div class="actions"><button class="btn primary" type="submit">ENVIAR REPORTE</button><button class="btn soft" type="button" onclick="location.href='normas.html'">VER NORMAS</button></div></form><section id="result" class="note ok" style="margin-top:14px" hidden></section></div>
<script>const q=new URLSearchParams(location.search);if(q.get('tipo'))target.value=q.get('tipo');function sendReport(e){e.preventDefault();const r=J.addReport({type:type.value,target:target.value,detail:detail.value,urgent:urgent.checked});result.hidden=false;result.innerHTML=`✅ Reporte recibido en la demo.<br><b>${r.id}</b><br>Estado: ${r.status}`;e.target.reset()}</script></main><div id="toast" class="toast"></div><script src="jemmo.js"></script></body></html>
