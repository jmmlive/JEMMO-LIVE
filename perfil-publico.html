<!doctype html>
<html lang="es" class="jemmo-auth-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09000f">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <style>html.jemmo-auth-pending body{visibility:hidden}</style>
  <title>JEMMO LIVE · Perfil</title>
  <style>
    :root{--bg:#070009;--panel:#16031e;--purple:#b82cff;--gold:#ffd34e;--pink:#ff3d8a;--text:#fff;--muted:#c8b8ce;--line:#65277c;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:dark}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{background:radial-gradient(circle at 50% 0,#51066a,#17021f 38%,#070009 78%)}button,a{font:inherit}.app{width:min(100%,520px);min-height:100svh;margin:auto;padding-bottom:calc(28px + var(--safe-bottom));background:linear-gradient(#09000cc9,#09000cf4),url('jemmo-fish-nav.webp') center 48%/280px no-repeat}
    .head{position:sticky;top:0;z-index:20;padding:calc(10px + var(--safe-top)) 12px 10px;display:grid;grid-template-columns:46px minmax(0,1fr) 46px;gap:9px;align-items:center;background:#0b000ee8;border-bottom:1px solid #55206c;backdrop-filter:blur(14px)}.head button,.head a{width:46px;height:46px;border:1px solid #6b2a85;border-radius:15px;background:#190321;color:#fff;display:grid;place-items:center;text-decoration:none;font-size:24px}.head div{min-width:0}.head small{display:block;color:var(--gold);font-weight:950;letter-spacing:.09em}.head strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:18px}
    .cover{height:190px;position:relative;background:linear-gradient(135deg,#41105c,#13021a);overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:none}.cover.has img{display:block}.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,#09000cea)}
    .card{position:relative;margin:-58px 13px 0;padding:0 15px 17px;border:1px solid #72308a;border-radius:25px;background:linear-gradient(180deg,#22052bdc,#100116f5);box-shadow:0 18px 55px #000b;backdrop-filter:blur(15px)}.avatar{position:relative;z-index:2;width:112px;height:112px;margin:-56px auto 0;border:3px solid var(--gold);border-radius:50%;background:#25052f url('jemmo-fish-nav.webp') center/cover no-repeat;box-shadow:0 0 0 6px #100116,0 0 26px #ffd34e66;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;display:none}.avatar.has img{display:block}
    .identity{text-align:center;padding-top:10px}.identity h1{margin:0;font-size:26px}.verified{color:#4aa2ff}.username{margin:4px 0 0;color:#d7c6dd}.place{margin:6px 0 0;color:#b9a9c0;font-size:12px}.bio{margin:13px auto 0;max-width:390px;color:#eee2f1;text-align:center;line-height:1.48;font-size:14px}.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:13px}.chip{padding:7px 10px;border:1px solid #603078;border-radius:99px;background:#120218;color:#ddcfe2;font-size:11px;font-weight:850}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.actions button,.actions a{min-height:50px;border-radius:16px;display:grid;place-items:center;text-decoration:none;font-weight:1000}.message{border:0;background:linear-gradient(90deg,var(--gold),#ff9447,var(--purple));color:#23041b}.secondary{border:1px solid #73308c;background:#24062e;color:#fff}.actions .full{grid-column:1/-1}.message:disabled{opacity:.55}
    .status{margin:14px 13px 0;padding:13px;border:1px solid #643078;border-radius:16px;background:#120218;color:#d7c7dc;text-align:center;font-size:12px;line-height:1.45}.status.error{border-color:#a33d54;color:#ffd0d7;background:#25050d}.details{margin:13px;padding:15px;border:1px solid #56216b;border-radius:21px;background:#100115cc}.details h2{margin:0 0 10px;font-size:14px;color:var(--gold)}.row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:9px;padding:9px 0;border-top:1px solid #3b1748;font-size:12px}.row:first-of-type{border-top:0}.row span{color:#9f8da7}.row b{overflow-wrap:anywhere}
  </style>
</head>
<body>
<main class="app">
  <header class="head">
    <button id="backButton" type="button" aria-label="Volver">‹</button>
    <div><small>JEMMO LIVE</small><strong id="headName">Perfil</strong></div>
    <a href="mensajes.html" aria-label="Mensajes">✉</a>
  </header>

  <section class="cover" id="cover"><img id="coverImage" alt="Portada del perfil"></section>
  <section class="card">
    <div class="avatar" id="avatar"><img id="avatarImage" alt="Foto del perfil"></div>
    <div class="identity">
      <h1 id="profileName">Cargando perfil…</h1>
      <p class="username" id="profileUsername"></p>
      <p class="place" id="profilePlace"></p>
      <p class="bio" id="profileBio"></p>
      <div class="chips" id="profileChips"></div>
    </div>
    <div class="actions" id="actions">
      <button class="message" id="messageButton" type="button">ENVIAR MENSAJE</button>
      <a class="secondary" href="mensajes.html">VER MENSAJES</a>
    </div>
  </section>
  <div class="status" id="status">Buscando el perfil real en Firebase…</div>
  <section class="details" id="details" hidden>
    <h2>Información pública</h2>
    <div class="row"><span>ID JEMMO</span><b id="profileId">—</b></div>
    <div class="row"><span>Correo de acceso</span><b id="profileEmail">—</b></div>
  </section>
</main>

<script type="module" src="jemmo-session.js"></script>
<script src="pwa-register.js"></script>
<script type="module">
  import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
  import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';

  const config={apiKey:'AIzaSyBK0-3RnU5JVx3hI_DoM9Bj2efnk3N4nBQ',authDomain:'jemmo-live.firebaseapp.com',projectId:'jemmo-live',storageBucket:'jemmo-live.firebasestorage.app',messagingSenderId:'355540892255',appId:'1:355540892255:web:d15a8dd03b2915e31939ea'};
  const app=getApps()[0]||initializeApp(config),auth=getAuth(app),db=getFirestore(app);
  const $=id=>document.getElementById(id);
  const targetUid=new URLSearchParams(location.search).get('uid')||'';
  let currentUser=null,target=null;
  const clean=value=>String(value||'').trim();
  const status=(text,error=false)=>{$('status').textContent=text;$('status').classList.toggle('error',error)};
  const normalized=(uid,data)=>({uid,name:clean(data.displayName||data.nombre||data.name||data.email?.split('@')[0]||'Usuario JEMMO'),email:clean(data.email),username:clean(data.username),bio:clean(data.bio),country:clean(data.country),city:clean(data.city),profileId:clean(data.profileId),avatarData:clean(data.avatarData),coverData:clean(data.coverData),coverPosition:data.coverPosition||{x:50,y:50},verified:Boolean(data.verified),level:Math.max(1,Number(data.level)||1)});

  function render(profile){
    target=profile;$('headName').textContent=profile.name;$('profileName').innerHTML=`${profile.name}${profile.verified?' <span class="verified">✓</span>':''}`;
    $('profileUsername').textContent=profile.username?`@${profile.username}`:'';
    $('profilePlace').textContent=[profile.country,profile.city].filter(Boolean).join(' · ');
    $('profileBio').textContent=profile.bio||'Este perfil todavía no ha añadido una frase pública.';
    $('profileChips').innerHTML=`<span class="chip">Nivel ${profile.level}</span><span class="chip">Perfil Firebase</span>`;
    $('profileId').textContent=profile.profileId||profile.uid;$('profileEmail').textContent=profile.email||'No visible';$('details').hidden=false;
    if(profile.avatarData){$('avatarImage').src=profile.avatarData;$('avatar').classList.add('has')}
    if(profile.coverData){$('coverImage').src=profile.coverData;$('cover').classList.add('has');const x=Math.max(0,Math.min(100,Number(profile.coverPosition?.x)||50)),y=Math.max(0,Math.min(100,Number(profile.coverPosition?.y)||50));$('coverImage').style.objectPosition=`${x}% ${y}%`}
    if(currentUser?.uid===profile.uid){$('actions').innerHTML='<a class="message full" href="yo.html">EDITAR MI PERFIL</a>';status('Este es tu perfil público conectado con Firebase.');}
    else status('Perfil real disponible. Puedes iniciar una conversación privada.');
  }

  async function loadProfile(){
    if(!targetUid){status('Falta identificar el perfil que quieres abrir.',true);$('messageButton').disabled=true;return}
    try{
      let snapshot=await getDoc(doc(db,'directorioMensajes',targetUid));
      if(!snapshot.exists()) snapshot=await getDoc(doc(db,'users',targetUid));
      if(!snapshot.exists()){status('Ese perfil todavía no está publicado. La persona debe iniciar sesión una vez con PRUEBA 07.',true);$('messageButton').disabled=true;return}
      render(normalized(snapshot.id,snapshot.data()||{}));
    }catch(error){console.warn(error);status(error?.code==='permission-denied'?'Firebase rechazó la lectura del perfil. Revisa las reglas de Firestore.':'No se pudo cargar el perfil. Comprueba Internet.',true);$('messageButton').disabled=true}
  }

  async function startMessage(){
    if(!currentUser||!target||currentUser.uid===target.uid)return;
    const button=$('messageButton');button.disabled=true;button.textContent='ABRIENDO…';
    try{
      let ownSnapshot=await getDoc(doc(db,'directorioMensajes',currentUser.uid));
      if(!ownSnapshot.exists()) ownSnapshot=await getDoc(doc(db,'users',currentUser.uid));
      const own=normalized(currentUser.uid,ownSnapshot.exists()?ownSnapshot.data():{displayName:currentUser.displayName,email:currentUser.email});
      const participants=[currentUser.uid,target.uid].sort(),conversationId=participants.join('__');
      const conversationRef=doc(db,'conversaciones',conversationId);
      const conversationSnapshot=await getDoc(conversationRef);
      const participantProfiles={
        [own.uid]:{name:own.name,email:own.email,username:own.username,avatarData:own.avatarData,country:own.country,city:own.city,bio:own.bio},
        [target.uid]:{name:target.name,email:target.email,username:target.username,avatarData:target.avatarData,country:target.country,city:target.city,bio:target.bio}
      };
      if(conversationSnapshot.exists()){
        await setDoc(conversationRef,{participantProfiles,updatedAt:serverTimestamp(),version:2},{merge:true});
      }else{
        await setDoc(conversationRef,{type:'direct',participants,participantProfiles,unreadBy:{[own.uid]:0,[target.uid]:0},lastMessage:'',lastSenderId:'',createdBy:currentUser.uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),version:2});
      }
      location.href=`mensajes.html?chat=${encodeURIComponent(conversationId)}`;
    }catch(error){console.warn(error);status(error?.code==='permission-denied'?'Firebase rechazó la conversación. Revisa las reglas de Mensajes.':'No se pudo abrir la conversación.',true);button.disabled=false;button.textContent='ENVIAR MENSAJE'}
  }

  $('backButton').addEventListener('click',()=>{if(history.length>1)history.back();else location.href='mensajes.html'});
  $('messageButton').addEventListener('click',startMessage);
  onAuthStateChanged(auth,user=>{if(!user)return;currentUser=user;loadProfile()});
</script>
</body>
</html>
