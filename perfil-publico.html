<body>
<main class="app">
  <header class="head">
    <button id="backButton" type="button" aria-label="Volver">‹</button>
    <div><small>JEMMO LIVE</small><strong id="headName">Perfil</strong></div>
    <a href="mensajes.html" aria-label="Mensajes">✉</a>
  </header>

  <section class="cover" id="cover"><img id="coverImage" alt="Portada del perfil"></section>
  <section class="card">
    <div class="avatar" id="avatar"><img id="avatarImage" alt="Foto del perfil"></div>
    <div class="identity">
      <h1 id="profileName">Cargando perfil…</h1>
      <p class="username" id="profileUsername"></p>
      <div class="public-id" id="publicIdLine" hidden><span id="profileId">—</span><button id="copyId" type="button" aria-label="Copiar ID">▣</button><button id="shareId" type="button" aria-label="Compartir ID">↗</button></div>
      <p class="place" id="profilePlace"></p>
      <p class="bio" id="profileBio"></p>
      <div class="chips" id="profileChips"></div>
    </div>
    <div class="actions" id="actions">
      <button class="message" id="messageButton" type="button">ENVIAR MENSAJE</button>
      <button class="gift" id="giftProfileButton" type="button">🎁 ENVIAR REGALO</button>
      <button class="secondary" id="copyProfileId" type="button">COPIAR ID</button>
      <button class="full-profile-toggle" id="fullProfileButton" type="button">VER PERFIL COMPLETO</button>
      <button class="danger" id="securityButton" type="button">BLOQUEAR O DENUNCIAR</button>
    </div>
  </section>

  <section class="full-profile hidden" id="fullProfile" aria-label="Perfil completo">
    <header class="full-profile-head"><small>PERFIL COMPLETO</small><h2 id="fullProfileTitle">Contenido y actividad</h2><p>Vídeos, fotos, publicaciones, información y redes que la persona haya decidido hacer públicas.</p></header>
    <div class="content-summary">
      <div class="summary-card"><b id="videoCount">0</b><span>VÍDEOS</span></div>
      <div class="summary-card"><b id="photoCount">0</b><span>FOTOS</span></div>
      <div class="summary-card"><b id="postCount">0</b><span>PUBLICACIONES</span></div>
    </div>
    <nav class="tabs" aria-label="Secciones del perfil">
      <button class="tab active" data-profile-tab="videos" type="button">VÍDEOS</button>
      <button class="tab" data-profile-tab="photos" type="button">FOTOS</button>
      <button class="tab" data-profile-tab="posts" type="button">PUBLICACIONES</button>
      <button class="tab" data-profile-tab="info" type="button">INFORMACIÓN</button>
    </nav>
    <section class="tab-panel" data-profile-panel="videos"><div class="media-grid" id="videosGrid"></div></section>
    <section class="tab-panel hidden" data-profile-panel="photos"><div class="media-grid" id="photosGrid"></div></section>
    <section class="tab-panel hidden" data-profile-panel="posts"><div class="posts" id="postsList"></div></section>
    <section class="tab-panel hidden" data-profile-panel="info">
      <div class="info-grid" id="publicInfo"></div>
      <div class="social-links" id="socialLinks"></div>
      <div class="medals" id="medals"></div>
    </section>
  </section>

  <div class="status" id="status">Cargando perfil público…</div>
</main>

<div class="viewer" id="mediaViewer" hidden>
  <section class="viewer-card" role="dialog" aria-modal="true" aria-label="Contenido del perfil">
    <button class="viewer-close" id="viewerClose" type="button" aria-label="Cerrar">×</button>
    <div class="viewer-media" id="viewerMedia"></div>
    <div class="viewer-title" id="viewerTitle"></div>
  </section>
</div>

<script type="module" src="jemmo-session.js"></script>
<script type="module" src="jemmo-social.js"></script>
<script src="pwa-register.js"></script>
<script type="module">
  import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
  import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
  import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, serverTimestamp, FieldPath } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
  import { copyPublicId, sharePublicId } from './jemmo-public-id.js';

  const config={apiKey:'AIzaSyBK0-3RnU5JVx3hI_DoM9Bj2efnk3N4nBQ',authDomain:'jemmo-live.firebaseapp.com',projectId:'jemmo-live',storageBucket:'jemmo-live.firebasestorage.app',messagingSenderId:'355540892255',appId:'1:355540892255:web:d15a8dd03b2915e31939ea'};
  const app=getApps()[0]||initializeApp(config),auth=getAuth(app),db=getFirestore(app);
  const $=id=>document.getElementById(id);
  const params=new URLSearchParams(location.search),targetUid=params.get('uid')||'';
  let currentUser=null,target=null,blockedByMe=false,fullOpen=params.get('full')==='1';
  const clean=value=>String(value??'').trim();
  const esc=value=>clean(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const blockId=(owner,targetId)=>`${owner}__${targetId}`;
  const toArray=value=>Array.isArray(value)?value:[];
  const unique=(items,key='url')=>{const seen=new Set();return items.filter(item=>{const value=clean(item?.[key]);if(!value||seen.has(value))return false;seen.add(value);return true})};
  const safeMediaUrl=value=>{const url=clean(value);return /^(https:\/\/|blob:|data:image\/|data:video\/)/i.test(url)?url:''};
  const safeWebUrl=value=>{let raw=clean(value);if(!raw)return'';if(!/^https?:\/\//i.test(raw))raw=`https://${raw}`;try{const url=new URL(raw);return url.protocol==='https:'?url.href:''}catch{return''}};
  const normalizedMedia=(value,type)=>toArray(value).map((item,index)=>{
    if(typeof item==='string')return{type,url:safeMediaUrl(item),title:`${type==='video'?'Vídeo':'Foto'} ${index+1}`};
    return{type,url:safeMediaUrl(item?.url||item?.src||item?.data),poster:safeMediaUrl(item?.poster||item?.thumbnail),title:clean(item?.title||item?.caption||`${type==='video'?'Vídeo':'Foto'} ${index+1}`),createdAt:item?.createdAt||item?.date||0};
  }).filter(item=>item.url);
  const normalizedPosts=value=>toArray(value).map((item,index)=>typeof item==='string'?{text:clean(item),title:'Publicación',createdAt:0}:{text:clean(item?.text||item?.body||item?.caption),title:clean(item?.title||'Publicación'),image:safeMediaUrl(item?.image||item?.photo),createdAt:item?.createdAt||item?.date||0}).filter(item=>item.text||item.image);
  const ruthTestVerified=data=>{const name=clean(data.displayName||data.nombre||data.name).toLocaleLowerCase('es');const username=clean(data.username).replace(/^@/,'').toLocaleLowerCase('es');return ['ruth','ru'].includes(name)||username==='ruth'};
  const normalized=(uid,data)=>{
    const avatarData=safeMediaUrl(data.avatarData||data.avatar||data.photoURL),coverData=safeMediaUrl(data.coverData||data.cover);
    const photos=normalizedMedia(data.photos||data.fotos||data.publicPhotos,'photo');
    if(avatarData)photos.push({type:'photo',url:avatarData,title:'Foto de perfil'});
    if(coverData)photos.push({type:'photo',url:coverData,title:'Portada del perfil'});
    return{uid,name:clean(data.displayName||data.nombre||data.name||'Usuario JEMMO'),publicId:clean(data.publicId||data.profileId),username:clean(data.username),bio:clean(data.bio),country:clean(data.country||data.pais),city:clean(data.city||data.ciudad),avatarData,coverData,coverPosition:data.coverPosition||{x:50,y:50},verified:Boolean(data.verified||data.isVerified||data.verificationStatus==='verified'||ruthTestVerified(data)),level:Math.max(1,Number(data.level)||1),videos:unique(normalizedMedia(data.videos||data.publicVideos,'video')),photos:unique(photos),posts:normalizedPosts(data.posts||data.publications||data.publicaciones),houseName:clean(data.houseName||data.casa||data.agencyName||data.agencia),role:clean(data.role||data.rol),joinedAt:data.joinedAt||data.createdAt||data.fechaRegistro||0,instagram:clean(data.instagram||data.socials?.instagram),tiktok:clean(data.tiktok||data.socials?.tiktok),youtube:clean(data.youtube||data.socials?.youtube),website:clean(data.website||data.web||data.socials?.website),medals:toArray(data.medals||data.medallas).map(clean).filter(Boolean),achievements:toArray(data.achievements||data.logros).map(clean).filter(Boolean)};
  };

  function setStatus(text,error=false,visible=true){const node=$('status');node.textContent=text;node.classList.toggle('error',error);node.classList.toggle('hidden',!visible)}
  function formatDate(value){let ms=0;if(value?.toMillis)ms=value.toMillis();else if(typeof value?.seconds==='number')ms=value.seconds*1000;else ms=Number(value)||Date.parse(value)||0;return ms?new Date(ms).toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'}):'No indicada'}
  function emptyContent(title,copy){return `<div class="empty-content"><div><b>${esc(title)}</b><span>${esc(copy)}</span></div></div>`}

  function openViewer(item){const url=safeMediaUrl(item.url);if(!url)return;const box=$('viewerMedia');box.innerHTML='';const media=document.createElement(item.type==='video'?'video':'img');media.src=url;if(item.type==='video'){media.controls=true;media.autoplay=true;media.playsInline=true;if(item.poster)media.poster=item.poster}media.alt=item.title||'Contenido público';box.append(media);$('viewerTitle').textContent=item.title||'';$('mediaViewer').hidden=false}
  function closeViewer(){$('mediaViewer').hidden=true;$('viewerMedia').innerHTML=''}

  function renderMedia(containerId,items,type){const box=$(containerId);box.innerHTML='';if(!items.length){box.innerHTML=emptyContent(type==='video'?'Todavía no hay vídeos públicos':'Todavía no hay fotos públicas',type==='video'?'Cuando esta persona publique un vídeo, aparecerá aquí.':'Las fotos que decida compartir aparecerán en esta sección.');return}items.forEach(item=>{const button=document.createElement('button');button.type='button';button.className='media-card';if(type==='video'){if(item.poster){const img=document.createElement('img');img.src=item.poster;img.alt='';button.append(img)}else{const fallback=document.createElement('span');fallback.className='media-fallback';fallback.textContent='🎬';button.append(fallback)}const play=document.createElement('span');play.className='play';play.textContent='▶';button.append(play)}else{const img=document.createElement('img');img.src=item.url;img.alt=item.title||'Foto pública';button.append(img)}const label=document.createElement('span');label.className='media-label';label.textContent=item.title||'';button.append(label);button.addEventListener('click',()=>openViewer(item));box.append(button)})}
  function renderPosts(profile){const box=$('postsList');box.innerHTML='';if(!profile.posts.length){box.innerHTML=emptyContent('Todavía no hay publicaciones','Las novedades, textos y fotos públicas de esta persona aparecerán aquí.');return}profile.posts.forEach(post=>{const article=document.createElement('article');article.className='post';article.innerHTML=`<div class="post-head"><b>${esc(post.title||'Publicación')}</b><time>${esc(formatDate(post.createdAt))}</time></div>${post.text?`<p>${esc(post.text)}</p>`:''}${post.image?`<img class="post-media" src="${esc(post.image)}" alt="">`:''}`;box.append(article)})}
  function socialHref(type,value){const raw=clean(value);if(!raw)return'';if(type==='instagram')return safeWebUrl(raw.includes('.')||raw.includes('/')?raw:`instagram.com/${raw.replace(/^@/,'')}`);if(type==='tiktok')return safeWebUrl(raw.includes('.')||raw.includes('/')?raw:`tiktok.com/@${raw.replace(/^@/,'')}`);if(type==='youtube')return safeWebUrl(raw.includes('.')||raw.includes('/')?raw:`youtube.com/@${raw.replace(/^@/,'')}`);return safeWebUrl(raw)}
  function renderInfo(profile){const location=[profile.country,profile.city].filter(Boolean).join(' · ')||'No indicada';const rows=[['ID JEMMO',profile.publicId||'Pendiente'],['Usuario',profile.username?`@${profile.username.replace(/^@/,'')}`:'No configurado'],['Ubicación',location],['Nivel',String(profile.level)],['Casa o agencia',profile.houseName||'No indicada'],['Rol público',profile.role||'Usuario'],['En JEMMO desde',formatDate(profile.joinedAt)]];$('publicInfo').innerHTML=rows.map(([label,value])=>`<div class="info-row"><span>${esc(label)}</span><b>${esc(value)}</b></div>`).join('');const socials=[['Instagram','◎',socialHref('instagram',profile.instagram)],['TikTok','♪',socialHref('tiktok',profile.tiktok)],['YouTube','▶',socialHref('youtube',profile.youtube)],['Web','↗',socialHref('website',profile.website)]];$('socialLinks').innerHTML=socials.map(([label,icon,href])=>href?`<a class="social-link" href="${esc(href)}" target="_blank" rel="noopener"><i>${icon}</i>${esc(label)}</a>`:`<span class="social-link disabled"><i>${icon}</i>${esc(label)} no vinculado</span>`).join('');const medals=[...profile.medals,...profile.achievements];$('medals').innerHTML=medals.length?medals.map(item=>`<span class="medal">🏅 ${esc(item)}</span>`).join(''):'<span class="medal">🏅 Logros pendientes</span>'}

  function setFullProfile(open,scroll=false){fullOpen=Boolean(open);$('fullProfile').classList.toggle('hidden',!fullOpen);$('fullProfileButton').textContent=fullOpen?'OCULTAR PERFIL COMPLETO':'VER PERFIL COMPLETO';if(fullOpen&&scroll)setTimeout(()=>$('fullProfile').scrollIntoView({behavior:'smooth',block:'start'}),40)}
  function switchTab(name){document.querySelectorAll('[data-profile-tab]').forEach(button=>button.classList.toggle('active',button.dataset.profileTab===name));document.querySelectorAll('[data-profile-panel]').forEach(panel=>panel.classList.toggle('hidden',panel.dataset.profilePanel!==name))}

  function render(profile){
    target=profile;$('headName').textContent=profile.name;$('profileName').innerHTML=`${esc(profile.name)}${profile.verified?' <span class="verified" aria-label="Cuenta verificada">✓</span>':''}`;
    $('profileUsername').textContent=profile.username?`@${profile.username.replace(/^@/,'')}`:'Sin nombre de usuario';$('profilePlace').textContent=[profile.country,profile.city].filter(Boolean).join(' · ');$('profileBio').textContent=profile.bio||'Este perfil todavía no ha añadido una presentación pública.';
    $('profileChips').innerHTML=`<span class="chip">Nivel ${profile.level}</span>${profile.houseName?`<span class="chip">${esc(profile.houseName)}</span>`:''}`;
    $('profileId').textContent=profile.publicId||'ID pendiente';$('publicIdLine').hidden=!profile.publicId;
    if(profile.avatarData){$('avatarImage').src=profile.avatarData;$('avatar').classList.add('has')}
    if(profile.coverData){$('coverImage').src=profile.coverData;$('cover').classList.add('has');const x=Math.max(0,Math.min(100,Number(profile.coverPosition?.x)||50)),y=Math.max(0,Math.min(100,Number(profile.coverPosition?.y)||50));$('coverImage').style.objectPosition=`${x}% ${y}%`}
    $('fullProfileTitle').textContent=`Contenido de ${profile.name}`;$('videoCount').textContent=String(profile.videos.length);$('photoCount').textContent=String(profile.photos.length);$('postCount').textContent=String(profile.posts.length);renderMedia('videosGrid',profile.videos,'video');renderMedia('photosGrid',profile.photos,'photo');renderPosts(profile);renderInfo(profile);setFullProfile(fullOpen,false);setStatus('',false,false);
    if(currentUser?.uid===profile.uid){$('messageButton').classList.add('hidden');$('giftProfileButton').classList.add('hidden');$('securityButton').classList.add('hidden');$('copyProfileId').insertAdjacentHTML('afterend','<a class="message" href="yo.html">EDITAR MI PERFIL</a>')}
  }

  async function refreshBlock(){if(!currentUser||!target||currentUser.uid===target.uid)return;try{const snap=await getDoc(doc(db,'bloqueos',blockId(currentUser.uid,target.uid)));blockedByMe=snap.exists()&&snap.data()?.active!==false;$('securityButton').textContent=blockedByMe?'DESBLOQUEAR O DENUNCIAR':'BLOQUEAR O DENUNCIAR';$('messageButton').disabled=blockedByMe;$('giftProfileButton').disabled=blockedByMe}catch{blockedByMe=false}}

  async function safeRead(collectionName){try{const snapshot=await getDoc(doc(db,collectionName,targetUid));return snapshot.exists()?snapshot.data()||{}:{}}catch{return{}}}
  async function loadProfile(){
    if(!targetUid){setStatus('Falta identificar el perfil que quieres abrir.',true,true);$('messageButton').disabled=true;$('giftProfileButton').disabled=true;return}
    try{const [userData,directoryData,publicData]=await Promise.all([safeRead('users'),safeRead('directorioMensajes'),safeRead('perfilesPublicos')]);const merged={...userData,...directoryData,...publicData};if(!Object.keys(merged).length){setStatus('Este perfil todavía no está publicado.',true,true);$('messageButton').disabled=true;$('giftProfileButton').disabled=true;return}render(normalized(targetUid,merged));await refreshBlock()}catch(error){console.warn(error);setStatus('No se pudo cargar el perfil. Comprueba la conexión y vuelve a intentarlo.',true,true);$('messageButton').disabled=true;$('giftProfileButton').disabled=true}
  }

  async function startMessage(openGift=false){
    if(!currentUser||!target||currentUser.uid===target.uid||blockedByMe)return;const button=openGift?$('giftProfileButton'):$('messageButton');button.disabled=true;const previous=button.textContent;button.textContent='ABRIENDO…';
    try{const ownSnapshot=await getDoc(doc(db,'directorioMensajes',currentUser.uid));const own=normalized(currentUser.uid,ownSnapshot.exists()?ownSnapshot.data():{displayName:currentUser.displayName});const participants=[currentUser.uid,target.uid].sort(),conversationId=participants.join('__');const conversationRef=doc(db,'conversaciones',conversationId),conversationSnapshot=await getDoc(conversationRef);const participantProfiles={[own.uid]:{name:own.name,publicId:own.publicId,username:own.username,avatarData:own.avatarData,country:own.country,city:own.city,bio:own.bio,verified:own.verified},[target.uid]:{name:target.name,publicId:target.publicId,username:target.username,avatarData:target.avatarData,country:target.country,city:target.city,bio:target.bio,verified:target.verified}};if(conversationSnapshot.exists())await updateDoc(conversationRef,new FieldPath('participantProfiles',own.uid),participantProfiles[own.uid],new FieldPath('participantProfiles',target.uid),participantProfiles[target.uid],'updatedAt',serverTimestamp(),'version',4);else await setDoc(conversationRef,{type:'direct',participants,participantProfiles,unreadBy:{[own.uid]:0,[target.uid]:0},lastMessage:'',lastSenderId:'',createdBy:currentUser.uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),version:4});location.href=`mensajes.html?chat=${encodeURIComponent(conversationId)}${openGift?'&gift=1':''}`}
    catch(error){console.warn(error);setStatus('No se pudo abrir la conversación.',true,true);button.disabled=false;button.textContent=previous}
  }

  async function securityAction(){if(!currentUser||!target)return;const action=prompt(`${blockedByMe?'Escribe DESBLOQUEAR para permitir mensajes.':'Escribe BLOQUEAR para impedir mensajes.'}\nTambién puedes escribir DENUNCIAR.`,'');const value=clean(action).toUpperCase();try{if(value==='BLOQUEAR'&&!blockedByMe){await setDoc(doc(db,'bloqueos',blockId(currentUser.uid,target.uid)),{ownerUid:currentUser.uid,blockedUid:target.uid,active:true,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),version:1});blockedByMe=true;setStatus('Usuario bloqueado. No podéis intercambiar mensajes.',false,true);await refreshBlock()}else if(value==='DESBLOQUEAR'&&blockedByMe){await deleteDoc(doc(db,'bloqueos',blockId(currentUser.uid,target.uid)));blockedByMe=false;setStatus('Usuario desbloqueado.',false,true);await refreshBlock()}else if(value==='DENUNCIAR'){const reason=clean(prompt('Motivo: spam, acoso, suplantación, posible menor u otro.','otro')).slice(0,40)||'otro';await addDoc(collection(db,'denuncias'),{reporterUid:currentUser.uid,targetUid:target.uid,conversationId:'',reason,status:'pending',createdAt:serverTimestamp(),version:1});setStatus('Denuncia enviada para revisión.',false,true)}}catch{setStatus('No se pudo completar la operación.',true,true)}}

  $('backButton').addEventListener('click',()=>{if(history.length>1)history.back();else location.href='mensajes.html'});$('messageButton').addEventListener('click',()=>startMessage(false));$('giftProfileButton').addEventListener('click',()=>startMessage(true));$('fullProfileButton').addEventListener('click',()=>setFullProfile(!fullOpen,true));$('copyId').addEventListener('click',()=>target?.publicId&&copyPublicId(target.publicId));$('copyProfileId').addEventListener('click',()=>target?.publicId&&copyPublicId(target.publicId));$('shareId').addEventListener('click',()=>target?.publicId&&sharePublicId(target.publicId,target.name));$('securityButton').addEventListener('click',securityAction);document.querySelectorAll('[data-profile-tab]').forEach(button=>button.addEventListener('click',()=>switchTab(button.dataset.profileTab)));$('viewerClose').addEventListener('click',closeViewer);$('mediaViewer').addEventListener('click',event=>{if(event.target===$('mediaViewer'))closeViewer()});addEventListener('keydown',event=>{if(event.key==='Escape')closeViewer()});
  onAuthStateChanged(auth,user=>{if(!user)return;currentUser=user;loadProfile()});
</script>
</body>
