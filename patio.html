<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08000d">
<title>Súper Patio | JEMMO Casa Padre</title>
<style>
*{box-sizing:border-box} :root{--g:#ffd84d;--v:#c22fff;--bg:#07000c}
html,body{margin:0;background:var(--bg);color:white;font-family:Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 50% 0,#3b075f,#0a0111 38%,#050008 80%)}
.app{width:min(100%,720px);margin:auto;padding:14px 14px 42px}
.top{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;padding:8px 0 13px;background:linear-gradient(#0b0113 70%,transparent)}
.back{width:44px;height:44px;border:1px solid #80501d;border-radius:14px;background:#180526;color:var(--g);font-size:22px}
h1{font-size:21px;margin:0;text-shadow:0 0 16px #a526ff}.sub{font-size:11px;color:var(--g);letter-spacing:1px;margin-top:4px}
.hero{padding:18px;border:1px solid #8e33ba;border-radius:23px;background:linear-gradient(145deg,#27053d,#0c0215);box-shadow:0 15px 40px #0008}
.hero b{color:var(--g);font-size:12px;letter-spacing:1px}.hero h2{margin:7px 0 7px;font-size:26px}.hero p{margin:0;color:#d9c4e3;font-size:13px;line-height:1.45}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 19px}
.level{padding:12px 7px;border:1px solid #6e278d;border-radius:17px;background:#13031f;text-align:center}.level strong{display:block;color:var(--g);font-size:17px}.level span{font-size:9px;color:#cbb5d5}
.title{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 10px}.title h3{margin:0;font-size:18px}.title small{color:#d15cff}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.memory{border:1px solid #7e2aa2;border-radius:19px;overflow:hidden;background:#11031c;text-align:left;color:#fff;padding:0;box-shadow:0 8px 24px #0006}
.art{height:160px;position:relative;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle,#8523bc,#25063b 58%,#09010f)}
.art .scene{font-size:62px;filter:drop-shadow(0 0 15px #d64cff);z-index:2}
.art .spark{position:absolute;font-size:23px;animation:float 2.6s infinite ease-in-out}
.art .s1{left:12%;top:15%}.art .s2{right:10%;top:22%;animation-delay:.4s}.art .s3{left:24%;bottom:10%;animation-delay:.8s}.art .s4{right:20%;bottom:12%;animation-delay:1.1s}
@keyframes float{50%{transform:translateY(-12px) rotate(8deg)}}
.live-art{background:radial-gradient(circle at 50% 65%,#d32bff,#551084 38%,#12021e 72%)}
.smoke{position:absolute;inset:0;background:radial-gradient(circle at 20% 80%,#fff4,transparent 23%),radial-gradient(circle at 80% 75%,#fff3,transparent 25%);filter:blur(9px)}
.rain{position:absolute;inset:0;background-image:linear-gradient(115deg,transparent 47%,#ffd84d 48%,transparent 50%);background-size:25px 32px;opacity:.35;animation:rain .8s linear infinite}
@keyframes rain{to{background-position:0 32px}}
.cap{padding:11px 12px 13px}.cap b{display:block;font-size:12px}.cap p{margin:5px 0 0;color:#cdb8d7;font-size:10px;line-height:1.35}
.star{grid-column:1/-1}.star .art{height:215px}.star .scene{font-size:84px}
.modal{display:none;position:fixed;z-index:20;inset:0;background:#030006eF;padding:18px;align-items:center;justify-content:center}.modal.show{display:flex}
.modal-card{width:min(100%,600px);border:1px solid var(--g);border-radius:24px;overflow:hidden;background:#11021c;box-shadow:0 0 45px #9f20ff66}
.modal-art{height:55vh;max-height:480px;display:grid;place-items:center;position:relative;background:radial-gradient(circle,#b32ce9,#431064 45%,#0b0112 75%);overflow:hidden}
.modal-art .big{font-size:110px;z-index:2;filter:drop-shadow(0 0 24px #e05cff)}
.modal-copy{padding:17px}.modal-copy h3{margin:0 0 7px;color:var(--g)}.modal-copy p{margin:0;color:#dbc8e3;line-height:1.45;font-size:13px}
.close{position:absolute;right:15px;top:15px;z-index:5;width:42px;height:42px;border:1px solid #fff5;border-radius:50%;background:#100219cc;color:#fff;font-size:21px}
</style>
</head>
<body>
<main class="app">
<header class="top"><button class="back" onclick="location.href='casa.html'">‹</button><div><h1>✦ SÚPER PATIO ✦</h1><div class="sub">JEMMO CASA PADRE · HISTORIA VIVA</div></div></header>

<section class="hero"><b>EL PATIO FUNDADOR</b><h2>Aquí empezó todo 💜</h2><p>Momentos, niveles y recuerdos de la Casa Padre. Toca cualquier cuadro para abrir la historia en grande.</p></section>

<section class="levels">
<div class="level"><strong>LV. 99</strong><span>NIVEL DE CASA</span></div>
<div class="level"><strong>1.27M</strong><span>LEGADO</span></div>
<div class="level"><strong>★ 48</strong><span>HISTORIAS</span></div>
</section>

<div class="title"><h3>Cuadros del Patio</h3><small>TOCA PARA VER</small></div>
<section class="gallery">
<button class="memory star" onclick="openMemory('La noche de los millones','Millones de regalos iluminaron la sala fundadora. El pescadito de JEMMO apareció en pleno LIVE entre humo, estrellas y una lluvia dorada que convirtió la Casa Padre en historia.','🐟')">
<div class="art live-art"><div class="smoke"></div><div class="rain"></div><span class="spark s1">🎁</span><span class="spark s2">💎</span><span class="spark s3">🎁</span><span class="spark s4">⭐</span><div class="scene">🐟</div></div>
<div class="cap"><b>La noche de los millones ✦</b><p>Un LIVE, humo y una lluvia imposible de regalos.</p></div>
</button>

<button class="memory" onclick="openMemory('Aquí nació JEMMO','El primer rincón de la Casa Padre. Antes de los rankings y las grandes casas, solo había una idea con ganas de crecer.','💜')">
<div class="art"><span class="spark s1">✦</span><span class="spark s2">⭐</span><div class="scene">💜</div></div>
<div class="cap"><b>Aquí nació JEMMO</b><p>El primer recuerdo de la casa fundadora.</p></div>
</button>

<button class="memory" onclick="openMemory('El pescadito hizo de las suyas','Nadie lo invitó al centro del LIVE, pero acabó robándose el cuadro. Desde entonces, el Patio guarda sus mejores apariciones.','🐟')">
<div class="art"><span class="spark s1">🫧</span><span class="spark s2">🫧</span><span class="spark s4">✨</span><div class="scene">🐟</div></div>
<div class="cap"><b>Haciendo de las suyas 🐟</b><p>La mascota apareció donde menos se esperaba.</p></div>
</button>

<button class="memory" onclick="openMemory('Casa Padre alcanzó nivel 99','Una marca simbólica para la demo de la casa fundadora. Los niveles reales se conectarán al sistema de progreso de JEMMO.','🏆')">
<div class="art"><span class="spark s1">⭐</span><span class="spark s2">99</span><div class="scene">🏆</div></div>
<div class="cap"><b>Nivel 99</b><p>La Casa Padre subió hasta lo más alto.</p></div>
</button>

<button class="memory" onclick="openMemory('La primera gran batalla','El Patio también conserva los momentos que movieron a toda la comunidad. Una batalla que llenó la sala de apoyo.','⚔️')">
<div class="art"><span class="spark s1">🔥</span><span class="spark s2">💜</span><div class="scene">⚔️</div></div>
<div class="cap"><b>La primera gran batalla</b><p>La comunidad entera entró a apoyar.</p></div>
</button>
</section>
</main>

<div class="modal" id="modal" onclick="if(event.target===this)closeMemory()">
<div class="modal-card">
<div class="modal-art" id="modalArt"><button class="close" onclick="closeMemory()">×</button><div class="rain"></div><div class="big" id="big">🐟</div></div>
<div class="modal-copy"><h3 id="modalTitle"></h3><p id="modalText"></p></div>
</div>
</div>
<script>
function openMemory(title,text,icon){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text;document.getElementById('big').textContent=icon;document.getElementById('modal').classList.add('show')}
function closeMemory(){document.getElementById('modal').classList.remove('show')}
</script>
</body>
</html>
