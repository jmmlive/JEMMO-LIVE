<div class="toast" id="toast"></div><script src="jemmo.js"></script><script>
let patio=JSON.parse(localStorage.getItem('jemmo_patio')||'["Luna: Buenos días Familia","Maya: Hoy hay música en la Casa","Nexo: Voy subiendo por el Ascensor"]');
function draw(){feed.innerHTML=patio.map(x=>`<div class="card" style="padding:12px">${x}</div>`).join('');feed.scrollTop=feed.scrollHeight}
function send(){let v=txt.value.trim();if(!v)return;patio.push('Tú: '+v);localStorage.setItem('jemmo_patio',JSON.stringify(patio));txt.value='';draw()}
draw();
</script></body></html>
