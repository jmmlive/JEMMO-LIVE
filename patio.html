function draw(){feed.innerHTML=patio.map(x=>{let a=x.split('|');return `<article class="card person-row"><div class="avatar"></div><div class="grow"><b>${a[0]}</b><small>${a[1]}</small></div><small class="muted">${a[2]||''}</small></article>`}).join('')}
