<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050008"><title>Ascensor JEMMO</title><style>
*{box-sizing:border-box}:root{--g:#ffd84d}html,body{margin:0;height:100%;overflow:hidden;background:#030005;color:#fff;font-family:Arial,sans-serif}.app{height:100dvh;max-width:720px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 20%,#31074d,#090010 48%,#030005)}button{font:inherit}
.head{position:absolute;z-index:10;left:13px;right:13px;top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}.back{width:43px;height:43px;border:1px solid #76501f;border-radius:14px;background:#170321;color:var(--g);font-size:23px}.head h1{font-size:19px;margin:0}.head small{color:var(--g);letter-spacing:1px}
.panel{position:absolute;z-index:7;top:calc(68px + env(safe-area-inset-top));left:13px;right:13px;height:55%;border:1px solid #77299a;border-radius:24px;background:linear-gradient(145deg,#1d052e,#09010f);padding:13px;overflow:auto;scrollbar-width:none}
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;align-items:end;gap:7px;height:42%;margin-bottom:13px}.top{border:1px solid #8758a0;border-radius:19px 19px 8px 8px;background:linear-gradient(#441066,#180426);color:#fff;text-align:center;padding:9px 5px 12px;position:relative}.top:nth-child(1){height:76%}.top:nth-child(2){height:100%;border-color:var(--g);box-shadow:0 0 24px #ffc21b33}.top:nth-child(3){height:64%}.crown{font-size:27px}.top b{display:block;font-size:12px;margin-top:4px}.top span{display:block;color:var(--g);font-size:10px;margin-top:3px}.top em{font-style:normal;font-size:9px;color:#cdb5d7}
.list{display:grid;gap:7px}.house{width:100%;border:1px solid #5e2776;border-radius:15px;background:#13031e;color:#fff;padding:11px;display:grid;grid-template-columns:42px 1fr auto;align-items:center;text-align:left}.floor{width:36px;height:36px;border-radius:12px;background:#2a073f;color:var(--g);display:grid;place-items:center;font-weight:900}.house b{font-size:12px}.house small{display:block;color:#cbb3d5;font-size:9px;margin-top:3px}.go{color:var(--g);font-size:20px}
.elevator{position:absolute;left:10%;right:10%;bottom:calc(18px + env(safe-area-inset-bottom));height:31%;border:2px solid #6c4a24;border-radius:25px 25px 8px 8px;background:#100217;overflow:hidden;box-shadow:0 0 35px #7c1ab044}.display{position:absolute;z-index:5;top:10px;left:50%;transform:translateX(-50%);min-width:115px;padding:7px 13px;border:1px solid #76531d;border-radius:10px;background:#050008;text-align:center;color:var(--g);font-weight:900;font-size:13px}.door{position:absolute;top:47px;bottom:0;width:50%;background:linear-gradient(90deg,#17041f,#3c0b50,#17041f);border-top:1px solid #8d37b1;transition:transform .9s cubic-bezier(.65,0,.35,1)}.left{left:0;border-right:1px solid #c95aff}.right{right:0;border-left:1px solid #c95aff}.elevator.open .left{transform:translateX(-101%)}.elevator.open .right{transform:translateX(101%)}.inside{position:absolute;inset:47px 0 0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#5a0d7d,#0c0113 70%)}.fish{font-size:55px}.inside p{font-size:11px;color:#d9c5e2;margin:4px 0}
</style></head><body><main class="app"><header class="head"><button class="back" onclick="location.href='casa.html'">‹</button><div><h1>ASCENSOR JEMMO</h1><small>OTRAS CASAS · POR NIVEL</small></div></header><section class="panel"><div class="podium">
<button class="top" onclick="travel(87,'Casa Diamante','💎')"><div class="crown">🥈</div><b>CASA DIAMANTE</b><span>PLANTA 87</span><em>LV. 87</em></button>
<button class="top" onclick="travel(99,'Casa Padre','🐟')"><div class="crown">👑</div><b>CASA PADRE</b><span>PLANTA 99</span><em>LV. 99</em></button>
<button class="top" onclick="travel(72,'Casa Lobos','🐺')"><div class="crown">🥉</div><b>CASA LOBOS</b><span>PLANTA 72</span><em>LV. 72</em></button></div><div class="list">
<button class="house" onclick="travel(64,'Imperio LIVE','👑')"><span class="floor">64</span><span><b>IMPERIO LIVE</b><small>Nivel 64 · 14 miembros activos</small></span><span class="go">›</span></button>
<button class="house" onclick="travel(51,'Casa Estrella','⭐')"><span class="floor">51</span><span><b>CASA ESTRELLA</b><small>Nivel 51 · Patio activo</small></span><span class="go">›</span></button>
<button class="house" onclick="travel(38,'Casa Global','🌍')"><span class="floor">38</span><span><b>CASA GLOBAL</b><small>Nivel 38 · 9 miembros activos</small></span><span class="go">›</span></button>
<button class="house" onclick="travel(32,'Casa Fuego','🔥')"><span class="floor">32</span><span><b>CASA FUEGO</b><small>Nivel 32 · Batalla esta noche</small></span><span class="go">›</span></button>
</div></section><section class="elevator" id="elevator"><div class="display" id="display">PUERTAS ABIERTAS</div><div class="inside"><div><div class="fish" id="fish">🐟</div><p id="insideText">Bienvenido al Ascensor JEMMO</p><b>ELIGE UNA CASA</b></div></div><div class="door left"></div><div class="door right"></div></section></main><script>
let busy=false;function travel(floor,name,icon){if(busy)return;busy=true;const e=document.getElementById('elevator'),d=document.getElementById('display'),t=document.getElementById('insideText'),f=document.getElementById('fish');e.classList.remove('open');d.textContent='CERRANDO...';setTimeout(()=>{d.textContent='SUBIENDO · '+floor;t.textContent='Destino: '+name;f.textContent=icon},950);setTimeout(()=>{d.textContent='PLANTA '+floor+' · DING ✦';e.classList.add('open')},2100);setTimeout(()=>{if(name==='Casa Padre')location.href='casa.html';else location.href='casa-demo.html?casa='+encodeURIComponent(name)+'&nivel='+floor+'&icon='+encodeURIComponent(icon)},3100)}setTimeout(()=>document.getElementById('elevator').classList.add('open'),200);
</script></body></html>
