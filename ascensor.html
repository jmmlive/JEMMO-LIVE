<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050008"><title>ASCENSOR JEMMO | JEMMO LIVE</title><link rel="stylesheet" href="jemmo.css"></head><body><main class="app"><div data-top="ASCENSOR JEMMO"></div>
<div class="wrap"><section class="card hero"><div class="eyebrow">ASCENSOR JEMMO</div><h1>Sube a otra Casa 🛗</h1><p>Las plantas representan niveles de progresión de Casa dentro de esta demo.</p></section><div class="section-head"><h2>Casas destacadas</h2></div><div class="list" id="houses"></div></div>
<script>const hs=[[99,'Casa Padre','🐟'],[87,'Casa Diamante','💎'],[72,'Casa Lobos','🐺'],[64,'Imperio LIVE','👑'],[51,'Casa Estrella','⭐'],[38,'Casa Global','🌍'],[32,'Casa Fuego','🔥']];houses.innerHTML=hs.map(x=>`<button class="row" onclick="go(${x[0]},'${x[1]}','${x[2]}')"><span class="ico">${x[2]}</span><span class="grow"><b>${x[1]}</b><small>Planta ${x[0]} · Nivel ${x[0]}</small></span><span class="arrow">›</span></button>`).join('');function go(n,name,icon){J.toast('🛗 Subiendo a planta '+n+' · ding ✦');setTimeout(()=>location.href=name==='Casa Padre'?'casa.html':`casa-demo.html?casa=${encodeURIComponent(name)}&nivel=${n}&icon=${encodeURIComponent(icon)}`,900)}</script></main><div data-nav="casa"></div><div id="toast" class="toast"></div><script src="jemmo.js"></script></body></html>
