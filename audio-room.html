<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JEMMO LIVE · Audio Room</title><style>

:root{--bg:#05030a;--panel:#11091c;--panel2:#190d29;--purple:#a528ff;--purple2:#6618ee;--gold:#ffd21c;--white:#f8f6ff;--muted:#aaa3b8;--line:rgba(185,75,255,.28);--green:#2de789;--red:#ff3d57;--blue:#32b8ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--white);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,rgba(111,31,255,.24),transparent 34%),linear-gradient(180deg,#08040f,#040208);overflow-x:hidden}
button,a,input{font:inherit}button{border:0}a{text-decoration:none;color:inherit}.app{width:min(100%,520px);margin:auto;min-height:100vh;padding-bottom:100px}
.topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:10px;padding:14px;background:rgba(5,3,10,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.icon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:#170d25;color:#fff;border:1px solid var(--line);cursor:pointer}.title{text-align:center}.title strong{display:block;font-size:18px}.title span{font-size:10px;color:var(--muted)}
main{padding:16px 14px 28px}.hero{padding:22px 18px;border-radius:26px;background:radial-gradient(circle at 80% 20%,rgba(255,210,28,.15),transparent 30%),linear-gradient(145deg,#1c0b2d,#08040d);border:1px solid rgba(201,78,255,.35);box-shadow:0 24px 70px rgba(0,0,0,.45)}
.hero h1{margin:0 0 8px;font-size:29px;line-height:1}.hero p{margin:0;color:#d2cadb;font-size:13px;line-height:1.55}.grid{display:grid;gap:14px;margin-top:18px}
.card{position:relative;overflow:hidden;min-height:190px;border-radius:25px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line);background:linear-gradient(145deg,#190b2a,#09050f);box-shadow:0 18px 50px rgba(0,0,0,.36);cursor:pointer}
.card.live{background:radial-gradient(circle at 78% 20%,rgba(222,59,255,.35),transparent 35%),linear-gradient(145deg,#240b35,#08040d)}.card.audio{background:radial-gradient(circle at 78% 20%,rgba(50,184,255,.30),transparent 35%),linear-gradient(145deg,#071b2c,#05080e)}
.card.games{background:radial-gradient(circle at 78% 20%,rgba(255,210,28,.22),transparent 35%),linear-gradient(145deg,#221700,#090703);opacity:.82}.badge{position:absolute;top:14px;left:14px;padding:6px 9px;border-radius:999px;font-size:9px;font-weight:900;border:1px solid currentColor;background:rgba(5,3,10,.72)}
.live .badge{color:#e765ff}.audio .badge{color:#55c9ff}.games .badge{color:var(--gold)}.symbol{position:absolute;right:18px;top:18px;font-size:55px;opacity:.18}.card h2{margin:0 0 6px;font-size:24px}.card p{margin:0 0 16px;color:#cfc7d8;font-size:12px;line-height:1.45;max-width:80%}
.action{align-self:flex-start;padding:11px 16px;border-radius:14px;font-weight:900;font-size:12px;color:white;background:linear-gradient(90deg,var(--purple2),#bf31ff)}.audio .action{background:linear-gradient(90deg,#075a92,#18a9ef)}.games .action{color:#796000;background:#ffe45d}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px max(8px,env(safe-area-inset-bottom));background:rgba(11,7,18,.98);border-top:1px solid var(--line);border-radius:24px 24px 0 0}
.nav{display:grid;justify-items:center;gap:4px;padding:7px 2px;color:#9f97aa;background:transparent;font-size:9px;font-weight:800;cursor:pointer}.nav svg{width:21px;height:21px}.nav.active{color:#fff}.nav.center{transform:translateY(-13px);width:60px;height:60px;border-radius:50%;justify-self:center;place-content:center;background:radial-gradient(circle at 35% 25%,#c24fff,#6215ef 58%,#25073d);border:2px solid #c64dff;box-shadow:0 0 26px rgba(166,42,255,.48)}.nav.center span{display:none}
.toast{position:fixed;left:50%;bottom:105px;transform:translate(-50%,20px);opacity:0;transition:.2s;width:min(calc(100% - 28px),480px);padding:12px 14px;border-radius:15px;background:#1a1026;border:1px solid var(--line);font-size:12px;font-weight:800}.toast.show{opacity:1;transform:translate(-50%,0)}

.room{min-height:100vh;padding:82px 14px 120px;background:radial-gradient(circle at 50% 20%,rgba(74,36,140,.5),transparent 34%),linear-gradient(180deg,#0a0611,#040208)}.room-head{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100%,520px);z-index:5;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:14px;background:rgba(5,3,10,.92);backdrop-filter:blur(18px)}.room-head h1{margin:0;text-align:center;font-size:17px}.room-head p{margin:3px 0 0;text-align:center;color:var(--muted);font-size:9px}.stage-card{border-radius:28px;padding:18px;background:radial-gradient(circle at 50% 20%,rgba(50,184,255,.15),transparent 34%),linear-gradient(145deg,#180e25,#09050f);border:1px solid var(--line)}.host-seat{display:grid;justify-items:center;margin-bottom:19px}.avatar{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:950;background:linear-gradient(145deg,#8b31ff,#281038);border:3px solid var(--gold);box-shadow:0 0 28px rgba(255,210,28,.22)}.host-seat strong{margin-top:7px}.host-seat span{font-size:9px;color:var(--gold)}.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:18px 8px}.seat{display:grid;justify-items:center;gap:5px}.seat .avatar{width:49px;height:49px;font-size:17px;border:2px solid #b74cff}.seat.empty .avatar{border-style:dashed;color:#71687b;background:#120b1a}.seat span{font-size:8px;color:#c8c0d1;text-align:center;white-space:nowrap;max-width:58px;overflow:hidden;text-overflow:ellipsis}.room-chat{margin-top:16px;border-radius:21px;padding:13px;background:#0e0816;border:1px solid var(--line);display:grid;gap:8px}.room-chat div{font-size:10px;color:#ded8e6}.controls{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px 10px max(10px,env(safe-area-inset-bottom));background:rgba(8,4,13,.96);border-top:1px solid var(--line)}.control{height:48px;border-radius:16px;background:#1c1029;color:white;border:1px solid var(--line);font-size:18px}.control.main{background:linear-gradient(145deg,#7b21ff,#c532ff)}
</style></head><body><header class="room-head"><button class="icon" onclick="location.href='salas.html'">←</button><div><h1>Audio Room</h1><p>Casa Padre · 10 sillas</p></div><button class="icon" onclick="showToast('Más opciones')">⋮</button></header><main class="room"><section class="stage-card"><div class="host-seat"><div class="avatar">J</div><strong>Jesús</strong><span>ANFITRIÓN</span></div><div class="seats">
<div class="seat"><div class="avatar">R</div><span>Ruth</span></div><div class="seat"><div class="avatar">Y</div><span>Yandira</span></div><div class="seat"><div class="avatar">A</div><span>Alexander</span></div><div class="seat"><div class="avatar">M</div><span>María</span></div><div class="seat"><div class="avatar">L</div><span>Luna</span></div>
<div class="seat empty"><button class="avatar" onclick="showToast('Solicitud para subir a la silla')">+</button><span>Silla 6</span></div><div class="seat empty"><button class="avatar" onclick="showToast('Solicitud para subir a la silla')">+</button><span>Silla 7</span></div><div class="seat empty"><button class="avatar" onclick="showToast('Solicitud para subir a la silla')">+</button><span>Silla 8</span></div><div class="seat empty"><button class="avatar" onclick="showToast('Solicitud para subir a la silla')">+</button><span>Silla 9</span></div><div class="seat empty"><button class="avatar" onclick="showToast('Solicitud para subir a la silla')">+</button><span>Silla 10</span></div></div></section><section class="room-chat"><div><b style="color:#e76cff">Ruth:</b> Buenas noches, familia.</div><div><b style="color:#ffd21c">Jesús:</b> Vamos a empezar.</div><div><b style="color:#55c9ff">Yandira:</b> Se escucha perfecto.</div></section></main><nav class="controls"><button class="control" onclick="showToast('Micrófono')">🎙</button><button class="control" onclick="showToast('Altavoz')">🔊</button><button class="control main" onclick="showToast('Pedir silla')">✋</button><button class="control" onclick="showToast('Regalos')">🎁</button><button class="control" onclick="showToast('Compartir')">↗</button></nav><div class="toast" id="toast"></div><script>let timer;function showToast(x){const t=document.getElementById('toast');t.textContent=x;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),2200)}</script></body></html>
