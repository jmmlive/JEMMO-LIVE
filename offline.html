<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09000f"><title>JEMMO LIVE · Sin conexión</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#351046,transparent 43%),#050007;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}main{width:min(100%,430px)}img{width:100%;max-height:150px;object-fit:contain;border-radius:20px}h1{color:#ffd24c}p{color:#d2c3d7;line-height:1.5}.status{display:inline-block;margin:8px 0 18px;padding:7px 10px;border:1px solid #84409a;border-radius:999px;background:#1b0722;font-size:12px}button{min-height:52px;padding:0 24px;border:0;border-radius:16px;background:linear-gradient(90deg,#ffd24c,#c539ff);color:#19031f;font-weight:950}</style></head><body><main><img src="jemmo-logo-header.webp" alt="JEMMO LIVE"><h1>Sin conexión</h1><p>JEMMO LIVE no puede conectar ahora. Revisa Wi‑Fi, datos móviles o VPN. La sesión verificada y los datos locales se conservarán.</p><span class="status" id="networkStatus">Esperando conexión…</span><br><button id="retry" type="button">REINTENTAR</button></main><script>const status=document.getElementById('networkStatus');const retry=()=>location.reload();document.getElementById('retry').addEventListener('click',retry);addEventListener('online',()=>{status.textContent='Conexión recuperada. Reintentando…';setTimeout(retry,350)});</script></body></html>
