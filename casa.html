<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JEMMO LIVE · Casa</title><link rel="stylesheet" href="jemmo.css"></head><body><div class="app" id="app"><header class="topbar"><button class="icon" onclick="location.href='casas.html'">←</button><div class="brand"><b id="short"></b> <span id="topName"></span></div><div class="wallet"><b>MONEDERO</b>1.250</div></header><main style="padding:0"><section class="house-stage" id="stage"><div class="room-backdrop"></div><div class="room-wall"><div class="house-banner"><div class="crest" id="crest"></div><div><h1 id="name"></h1><p id="motto"></p><p id="agent"></p></div><span class="level" id="level"></span></div><section class="salon"><button class="elevator-door" onclick="openElevator()" aria-label="Abrir ascensor"></button><div class="seat s1"><div class="avatar">L</div><small>Luna</small></div><div class="seat s2"><div class="avatar">M</div><small>Mara</small></div><div class="seat s3"><div class="avatar">Y</div><small>Yandira</small></div><div class="seat s4"><div class="avatar">R</div><small>Ruth</small></div><button class="seat s5 free" id="freeSeat" onclick="joinSeat()"><div class="avatar">+</div><small>Silla libre</small></button><div class="central-table"><div><b>SALÓN CENTRAL</b><span id="inside"></span></div></div></section><div class="wall-actions"><button class="action-btn" onclick="toast('Audio Room de la Casa abierto')">Audio Room</button><button class="action-btn" onclick="toast('Tablón del Agente')">Tablón</button><button class="action-btn" onclick="toast('Eventos de la Casa')">Eventos</button><button class="action-btn" onclick="location.href='casas.html'">Visitar Casas</button></div><section class="chat-panel"><b>Conversación de la Casa</b><div id="chat"><div class="chat-line"><b>Luna:</b> Bienvenido a la Casa.</div><div class="chat-line"><b>Ruth:</b> La reunión empieza en diez minutos.</div></div><div class="chat-send"><input id="msg" placeholder="Habla con la Casa"><button onclick="sendMsg()">Enviar</button></div></section></div></section></main></div><nav class="bottom-nav"><a href="index.html"><b>⌂</b>INICIO</a><a href="#" onclick="toast('LIVE')"><b>◉</b>LIVE</a><a class="active" href="casas.html"><b>◇</b>CASAS</a><a href="#" onclick="toast('Mensajes')"><b>✉</b>MENSAJES</a><a href="#" onclick="toast('Perfil')"><b>○</b>YO</a></nav><div id="elevator" class="modal"><div class="sheet"><h3>Ascensor JEMMO</h3><input id="searchHouse" class="search" placeholder="Buscar Casa" oninput="drawElevator()"><div id="elevatorList" class="elevator-list"></div><button class="action-btn" style="width:100%;margin-top:12px" onclick="closeElevator()">Cerrar puertas</button></div></div><div id="toast" class="toast"></div><script src="jemmo-data.js"></script><script src="app.js"></script><script>const h=currentHouse();document.documentElement.style.setProperty('--hc',h.color);document.documentElement.style.setProperty('--ha',h.accent);stage.style.setProperty('--hc',h.color);stage.style.setProperty('--ha',h.accent);crest.textContent=h.tag;short.textContent=h.tag;topName.textContent=h.name;name.textContent=h.name;motto.textContent=h.motto;agent.textContent='Agente: '+h.agent;level.textContent='Nivel '+h.level;inside.textContent=h.online+' personas dentro';function joinSeat(){const n=localStorage.getItem('jemmo_name')||'Jesús';freeSeat.classList.remove('free');freeSeat.innerHTML=`<div class="avatar">${n.slice(0,1).toUpperCase()}</div><small>${n}</small>`;toast('Has subido a la silla de la Casa')}function sendMsg(){const v=msg.value.trim();if(!v)return;chat.insertAdjacentHTML('beforeend',`<div class="chat-line"><b>Tú:</b> ${v.replace(/[<>]/g,'')}</div>`);msg.value=''}function openElevator(){elevator.classList.add('show');drawElevator()}function closeElevator(){elevator.classList.remove('show')}function drawElevator(){const q=(searchHouse.value||'').toLowerCase();elevatorList.innerHTML=JEMMO_HOUSES.filter(x=>x.name.toLowerCase().includes(q)).map(x=>`<button class="elevator-item" style="--hc:${x.color}" onclick="saveHouse('${x.id}');location.href='casa.html?id=${x.id}'"><span class="mini">${x.tag}</span><span><b>${x.name}</b><small style="display:block;color:#aaa">${x.online} dentro · Nivel ${x.level}</small></span><span>›</span></button>`).join('')}</script></body></html>
