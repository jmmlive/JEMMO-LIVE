<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JEMMO LIVE · En directo</title><style>
:root{
  --bg:#05030a;--panel:#120a1d;--panel2:#1a0e2a;--purple:#a62cff;--purple2:#6d19ef;
  --gold:#ffd21c;--white:#faf8ff;--muted:#aea6b9;--line:rgba(184,76,255,.28);
  --green:#2de789;--red:#ff4b62;--blue:#38bfff;--shadow:0 22px 65px rgba(0,0,0,.5)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--white);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(circle at 50% -10%,rgba(113,31,255,.25),transparent 34%),
             linear-gradient(180deg,#08040f,#040208);
  overflow-x:hidden
}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
a{text-decoration:none;color:inherit}
.app{width:min(100%,520px);min-height:100vh;margin:auto;padding-bottom:96px}
.topbar{
  position:sticky;top:0;z-index:30;display:grid;grid-template-columns:46px 1fr 46px;
  align-items:center;gap:10px;padding:14px;
  padding-top:max(14px,env(safe-area-inset-top));
  background:rgba(5,3,10,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)
}
.icon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:#170d25;color:#fff;border:1px solid var(--line)}
.title{text-align:center}.title strong{display:block;font-size:18px}.title span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
main{padding:16px 14px 30px}
.hero,.panel{border-radius:25px;border:1px solid var(--line);background:linear-gradient(145deg,#1a0c2a,#09050f);box-shadow:var(--shadow)}
.hero{padding:22px 18px;background:radial-gradient(circle at 84% 20%,rgba(255,210,28,.15),transparent 30%),linear-gradient(145deg,#1d0c2e,#08040d)}
.hero h1{margin:0 0 8px;font-size:29px;line-height:1}.hero p{margin:0;color:#d2cadb;font-size:13px;line-height:1.5}
.grid{display:grid;gap:14px;margin-top:18px}
.card{
  position:relative;overflow:hidden;min-height:190px;padding:18px;border-radius:25px;
  border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;
  box-shadow:var(--shadow)
}
.card.live{background:radial-gradient(circle at 80% 17%,rgba(222,59,255,.35),transparent 35%),linear-gradient(145deg,#250c36,#08040d)}
.card.multi{background:radial-gradient(circle at 80% 17%,rgba(255,210,28,.25),transparent 35%),linear-gradient(145deg,#211300,#08040d)}
.card.audio{background:radial-gradient(circle at 80% 17%,rgba(56,191,255,.28),transparent 35%),linear-gradient(145deg,#071d2e,#05080e)}
.card.games{opacity:.82;background:radial-gradient(circle at 80% 17%,rgba(255,210,28,.2),transparent 35%),linear-gradient(145deg,#231800,#080603)}
.badge{position:absolute;top:14px;left:14px;padding:6px 9px;border-radius:999px;font-size:9px;font-weight:950;border:1px solid currentColor;background:rgba(5,3,10,.75)}
.live .badge{color:#e66bff}.multi .badge{color:var(--gold)}.audio .badge{color:#57caff}.games .badge{color:var(--gold)}
.symbol{position:absolute;right:18px;top:16px;font-size:45px;font-weight:950;opacity:.14}
.card h2{margin:0 0 6px;font-size:24px}.card p{margin:0 0 16px;max-width:84%;font-size:12px;line-height:1.45;color:#d0c8d9}
.action{align-self:flex-start;padding:11px 16px;border-radius:14px;color:#fff;font-size:12px;font-weight:950;background:linear-gradient(90deg,var(--purple2),#c431ff)}
.multi .action{background:linear-gradient(90deg,#9f6900,#ffd21c);color:#261900}.audio .action{background:linear-gradient(90deg,#09649d,#20acef)}.games .action{background:#ffe35b;color:#5d4a00}
.field{display:grid;gap:7px;margin-top:13px}.field label{font-size:11px;font-weight:850;color:#d7d0df}
.field input,.field textarea,.field select{width:100%;border-radius:15px;border:1px solid var(--line);background:#0b0611;color:#fff;padding:13px 14px;outline:none}
.field textarea{min-height:88px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#bd4aff;box-shadow:0 0 0 3px rgba(189,74,255,.12)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{width:100%;margin-top:16px;padding:14px;border-radius:16px;color:#fff;font-weight:950;background:linear-gradient(90deg,#711cff,#c532ff);box-shadow:0 0 26px rgba(178,45,255,.32)}
.secondary{width:100%;margin-top:9px;padding:13px;border-radius:16px;color:#fff;font-weight:850;background:#1b1127;border:1px solid var(--line)}
.cover{position:relative;height:230px;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#7f2cff,#2c103f 38%,#0a0510 75%);border:1px solid var(--line);display:grid;place-items:center}
.cover img,.cover video{width:100%;height:100%;object-fit:cover}.cover-placeholder{text-align:center;color:#d8d0df}.cover-placeholder b{display:block;font-size:32px}.cover-placeholder span{font-size:11px}
.cover-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.cover-actions label,.cover-actions button{padding:11px;border-radius:14px;text-align:center;background:#1b1029;color:#fff;border:1px solid var(--line);font-size:11px;font-weight:850}
.notice{margin-top:12px;padding:11px 12px;border-radius:14px;background:rgba(255,210,28,.08);border:1px solid rgba(255,210,28,.22);color:#eee0a6;font-size:10px;line-height:1.45}
.checklist{display:grid;gap:8px;margin-top:14px}.check{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:13px;background:#0e0816;border:1px solid rgba(255,255,255,.07);font-size:11px}.dot{width:10px;height:10px;border-radius:50%;background:#665e6d}.check.ok .dot{background:var(--green);box-shadow:0 0 10px rgba(45,231,137,.6)}.check.bad .dot{background:var(--red)}
.bottom{position:fixed;z-index:35;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px max(8px,env(safe-area-inset-bottom));background:rgba(10,6,16,.98);border-top:1px solid var(--line);border-radius:24px 24px 0 0}
.nav{display:grid;justify-items:center;gap:4px;padding:7px 2px;background:transparent;color:#a69eaf;font-size:9px;font-weight:800}.nav.active{color:#fff}.nav.center{transform:translateY(-13px);width:60px;height:60px;border-radius:50%;justify-self:center;place-content:center;background:radial-gradient(circle at 35% 25%,#c34fff,#6115ef 58%,#25073d);border:2px solid #c64dff;box-shadow:0 0 26px rgba(166,42,255,.48)}.nav.center span{display:none}
.toast{position:fixed;z-index:100;left:50%;bottom:105px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.2s;width:min(calc(100% - 28px),480px);padding:12px 14px;border-radius:15px;background:#1a1026;border:1px solid var(--line);font-size:12px;font-weight:850}.toast.show{opacity:1;transform:translate(-50%,0)}
.stage{min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 28%,#7e2cff 0 8%,#311047 34%,#0b0611 72%,#05030a)}
.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 30%,transparent 58%,rgba(0,0,0,.86))}
.live-top{position:absolute;top:max(14px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;gap:8px;z-index:4}
.pill{padding:8px 10px;border-radius:999px;background:rgba(9,5,15,.72);border:1px solid rgba(255,255,255,.15);font-size:9px}
.float{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;background:rgba(17,9,28,.82);border:1px solid rgba(255,255,255,.15);color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.side{position:absolute;right:12px;bottom:150px;display:grid;gap:10px;z-index:4}
.chat{position:absolute;left:13px;right:76px;bottom:105px;z-index:4;display:grid;gap:7px}.msg{width:max-content;max-width:100%;padding:7px 9px;border-radius:12px;background:rgba(9,5,15,.64);font-size:10px}
.end-btn{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);z-index:5;padding:13px 22px;border-radius:999px;background:linear-gradient(90deg,#b11d3d,#ff4b62);color:#fff;font-weight:950}
.modal-bg{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.72);display:none;place-items:end center}.modal-bg.show{display:grid}.modal{width:min(100%,520px);padding:18px 15px 26px;border-radius:28px 28px 0 0;background:#120a1d;border:1px solid var(--line)}.modal h3{margin:0 0 10px}.summary-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px}
.seat-grid{position:absolute;inset:85px 12px 120px;display:grid;gap:8px;z-index:3}.seat-grid.n4{grid-template-columns:repeat(2,1fr)}.seat-grid.n8,.seat-grid.n10,.seat-grid.n12,.seat-grid.n16{grid-template-columns:repeat(4,1fr)}
.seat{position:relative;min-height:90px;border-radius:18px;background:linear-gradient(145deg,#241334,#0d0714);border:1px solid var(--line);display:grid;place-items:center;text-align:center;padding:6px}.seat.host{border-color:var(--gold)}.seat .avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#7c28e9;font-weight:950}.seat small{font-size:8px;color:#cfc7d7}.status-light{position:absolute;right:7px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 9px rgba(45,231,137,.75)}.status-light.done{background:var(--red);box-shadow:0 0 9px rgba(255,75,98,.75)}
@media(max-width:390px){.two{grid-template-columns:1fr}.seat-grid.n12,.seat-grid.n16{grid-template-columns:repeat(4,1fr)}.seat{min-height:78px}.card{min-height:175px}}

.main-video{position:absolute;inset:0;z-index:1}.main-video video{width:100%;height:100%;object-fit:cover}.guest-strip{position:absolute;right:10px;top:100px;z-index:4;display:grid;gap:8px}.guest{width:78px;height:104px;border-radius:16px;background:#1d1029;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;text-align:center;padding:5px}.guest .status-light{position:static;margin:4px auto}.task{position:absolute;left:12px;top:75px;z-index:4;padding:9px 11px;border-radius:14px;background:rgba(9,5,15,.78);border:1px solid rgba(45,231,137,.38);font-size:10px}.controls-menu{position:absolute;right:12px;top:70px;z-index:5;display:none;width:210px;padding:10px;border-radius:17px;background:#160d22;border:1px solid var(--line)}.controls-menu.show{display:grid;gap:7px}.controls-menu button{padding:10px;border-radius:12px;background:#28143a;color:#fff;text-align:left}
</style></head><body><div class="stage"><div class="main-video"><video id="liveVideo" autoplay muted playsinline></video></div>
<div class="live-top"><button class="icon" onclick="confirmExit()">←</button><span class="pill">● LIVE</span><span class="pill" id="viewerCount">1.248 espectadores</span><button class="icon" style="margin-left:auto" onclick="toggleTools()">⋮</button></div>
<div class="task">Tarea LIVE · <b id="timer">00:00</b></div>
<div class="guest-strip" id="guestStrip"></div>
<div class="controls-menu" id="tools"><button onclick="showToast('Compartir LIVE')">Compartir LIVE</button><button onclick="showToast('Toda la sala silenciada · demostración')">Silenciar toda la sala</button><button onclick="showToast('Solicitudes de invitados abiertas')">Gestionar solicitudes</button><button onclick="showToast('Regalos activados')">Regalos</button><button onclick="showToast('Afortunados activado')">Afortunados</button></div>
<div class="side"><button class="float" onclick="addGuest()">＋</button><button class="float" onclick="showToast('Caja de regalos')">🎁</button><button class="float" onclick="showToast('Afortunados')">🍀</button><button class="float" onclick="showToast('Compartir')">↗</button></div>
<div class="chat"><div class="msg"><b style="color:#e66bff">Ruth:</b> ¡Vamos con todo!</div><div class="msg"><b style="color:#ffd21c">Jesús:</b> Bienvenidos.</div></div>
<button class="end-btn" onclick="finishLive()">Finalizar LIVE</button><div class="toast" id="toast"></div></div>
<div class="modal-bg" id="summary"><div class="modal"><h3>Resumen de la transmisión</h3><div class="summary-row"><span>Duración total</span><b id="sumTime"></b></div><div class="summary-row"><span>Minutos válidos de tarea</span><b id="sumTask"></b></div><div class="summary-row"><span>Espectadores totales</span><b>1.863</b></div><div class="summary-row"><span>Regalos recibidos</span><b>8.450</b></div><div class="summary-row"><span>Nuevos seguidores</span><b>37</b></div><div class="summary-row"><span>Invitados que subieron</span><b id="sumGuests">0</b></div><button class="primary" onclick="location.href='index.html'">Volver al Inicio</button><button class="secondary" onclick="location.href='salas.html'">Volver a Salas</button></div></div>
<script>let toastTimer;function showToast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2400)}
let secs=0,guests=0,stream;setInterval(()=>{secs++;document.getElementById('timer').textContent=fmt(secs)},1000);
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
async function startMedia(){try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});document.getElementById('liveVideo').srcObject=stream}catch(e){showToast('No se pudo abrir la cámara. Revisa los permisos')}}
function addGuest(){if(guests>=5)return showToast('Máximo 5 invitados laterales');guests++;const d=document.createElement('div');d.className='guest';d.innerHTML=`Invitado ${guests}<i class="status-light"></i><button onclick="guestMenu(this)" style="margin-top:5px;border-radius:8px;padding:5px">Gestionar</button>`;document.getElementById('guestStrip').appendChild(d);showToast('Invitado aceptado con permiso')}
function guestMenu(btn){const choice=prompt('1 Bajar de la silla\n2 Silenciar\n3 Dar administración\n4 Expulsar 20 minutos');if(choice==='1')btn.parentElement.remove();if(choice==='2')showToast('Invitado silenciado');if(choice==='3')showToast('Administración concedida: bajar, silenciar y expulsar');if(choice==='4'){btn.parentElement.remove();showToast('Expulsado. No puede entrar durante 20 minutos')}}
function toggleTools(){document.getElementById('tools').classList.toggle('show')}
function finishLive(){if(stream)stream.getTracks().forEach(t=>t.stop());document.getElementById('sumTime').textContent=fmt(secs);document.getElementById('sumTask').textContent=fmt(secs);document.getElementById('sumGuests').textContent=guests;document.getElementById('summary').classList.add('show')}
function confirmExit(){confirm('¿Salir del LIVE?')&&finishLive()}startMedia();
</script></body></html>
