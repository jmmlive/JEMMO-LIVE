<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09000f"><title>LIVE · JEMMO LIVE</title><link rel="stylesheet" href="jemmo.css"><script>if(localStorage.getItem('jemmo_logged')!=='yes')location.replace('acceso.html');</script></head><body><div class="shell"><header class="top"><button class="iconbtn" onclick="back()"><svg class="ico" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div><h1>LIVE</h1><small>En vivo ahora</small></div><span class="pill"><span class="dot"></span>JEMMO</span></header><main class="content">

<div style="position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between"><span class="badge-live">● LIVE <span id="viewerTop" style="margin-left:6px">1.2K</span></span><span class="pill">España</span></div>
<div style="position:absolute;left:16px;right:16px;bottom:16px"><h2 style="margin:0">LunaCanaria</h2><p class="muted">Charlando con JEMMO</p><div id="chat" class="stack" style="max-height:125px;overflow:auto;margin:10px 0"></div><div class="row"><input id="msg" placeholder="Di algo..."><button class="action" onclick="sendMsg()">➤</button></div></div>
</section>
<div class="row" style="margin-top:12px"><button class="btn" id="startBtn" onclick="toggleLive()">INICIAR LIVE</button><button class="btn alt" onclick="switchMode()"><span id="mode">VÍDEO</span></button></div>
</main></div>

</nav><div class="toast" id="toast"></div><script src="jemmo.js"></script><script>
let mode='VÍDEO',running=false;let msgs=JSON.parse(localStorage.getItem('jemmo_live_chat')||'["Maya: Hola Luna","Nexo: Saludos desde la Casa"]');
function render(){chat.innerHTML=msgs.slice(-5).map(m=>`<div style="font-size:12px;text-shadow:0 1px 3px #000">${m}</div>`).join('');chat.scrollTop=chat.scrollHeight}
function toggleLive(){running=!running;startBtn.textContent=running?'FINALIZAR':'INICIAR LIVE';toastMsg(running?'Estás en directo':'Directo finalizado')}
function switchMode(){mode=mode==='VÍDEO'?'VOZ':'VÍDEO';document.getElementById('mode').textContent=mode}
function sendMsg(){let v=msg.value.trim();if(!v)return;msgs.push('Tú: '+v);localStorage.setItem('jemmo_live_chat',JSON.stringify(msgs));msg.value='';render()} render();
</script></body></html>
