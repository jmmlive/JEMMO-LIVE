<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09000f"><title>LIVE · JEMMO LIVE</title><link rel="stylesheet" href="jemmo.css"><style>@keyframes pulse{to{transform:scale(1.06);box-shadow:0 0 75px rgba(255,203,45,.45)}}</style></head><body><div class="shell"><header class="top"><button class="iconbtn" onclick="back()" aria-label="Atrás"><svg class="ico" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div><h1>LIVE</h1><small>Transmitir · voz · conversación</small></div><span class="pill"><span class="dot"></span>JEMMO</span></header><main class="content">
<section class="hero"><div class="kicker">DIRECTO · DEMO FUNCIONAL</div><h2>Tu sala LIVE.</h2><p>Activa cámara o voz, cambia el modo y abre el chat de la sala. La experiencia queda guardada en tu móvil.</p><div class="row" style="margin-top:16px"><button class="btn" id="startBtn" onclick="toggleLive()">INICIAR LIVE</button><button class="btn alt" onclick="switchMode()">MODO: <span id="mode">VÍDEO</span></button></div></section>
<div class="section"><h2>Sala</h2><span id="status">Fuera de emisión</span></div>
<section class="card" style="min-height:310px;display:grid;place-items:center;text-align:center">
<div><div id="orb" style="width:128px;height:128px;border-radius:50%;margin:auto;background:radial-gradient(circle at 35% 28%,#ef78ff,#7d17b7 47%,#210330);box-shadow:0 0 50px rgba(196,45,255,.38)"></div><h3 id="roomTitle">Jesús LIVE</h3><p class="muted" id="viewers">0 personas dentro</p></div></section>
<div class="section"><h2>Chat de sala</h2><span>en vivo</span></div>
<section class="card"><div id="chat" class="stack" style="margin-bottom:12px"></div><div class="row"><input id="msg" placeholder="Escribe en la sala"><button class="btn" style="flex:0 0 auto" onclick="sendMsg()">Enviar</button></div></section>
</main></div>

</nav>
<div class="toast" id="toast"></div><script src="jemmo.js"></script><script>
let mode='VÍDEO',running=false;
let msgs=JSON.parse(localStorage.getItem('jemmo_live_chat')||'["Luna: Hola JEMMO","Nexo: La sala se ve brutal"]');
function render(){chat.innerHTML=msgs.map(m=>`<div class="pill">${m}</div>`).join('')}
function toggleLive(){running=!running;startBtn.textContent=running?'DETENER LIVE':'INICIAR LIVE';status.textContent=running?'EN DIRECTO':'Fuera de emisión';viewers.textContent=(running?Math.floor(12+Math.random()*30):0)+' personas dentro';orb.style.animation=running?'pulse 1.2s infinite alternate':'none';toastMsg(running?'LIVE iniciado':'LIVE finalizado')}
function switchMode(){mode=mode==='VÍDEO'?'VOZ':'VÍDEO';document.getElementById('mode').textContent=mode;toastMsg('Modo '+mode)}
function sendMsg(){let v=msg.value.trim();if(!v)return;msgs.push('Tú: '+v);localStorage.setItem('jemmo_live_chat',JSON.stringify(msgs));msg.value='';render()}
render();
</script></body></html>
