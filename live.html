<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JEMMO LIVE · LIVE</title><style>

:root{--bg:#05030a;--panel:#11091c;--panel2:#190d29;--purple:#a528ff;--purple2:#6618ee;--gold:#ffd21c;--white:#f8f6ff;--muted:#aaa3b8;--line:rgba(185,75,255,.28);--green:#2de789;--red:#ff3d57;--blue:#32b8ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--white);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,rgba(111,31,255,.24),transparent 34%),linear-gradient(180deg,#08040f,#040208);overflow-x:hidden}
button,a,input{font:inherit}button{border:0}a{text-decoration:none;color:inherit}.app{width:min(100%,520px);margin:auto;min-height:100vh;padding-bottom:100px}
.topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:10px;padding:14px;background:rgba(5,3,10,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.icon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:#170d25;color:#fff;border:1px solid var(--line);cursor:pointer}.title{text-align:center}.title strong{display:block;font-size:18px}.title span{font-size:10px;color:var(--muted)}
main{padding:16px 14px 28px}.hero{padding:22px 18px;border-radius:26px;background:radial-gradient(circle at 80% 20%,rgba(255,210,28,.15),transparent 30%),linear-gradient(145deg,#1c0b2d,#08040d);border:1px solid rgba(201,78,255,.35);box-shadow:0 24px 70px rgba(0,0,0,.45)}
.hero h1{margin:0 0 8px;font-size:29px;line-height:1}.hero p{margin:0;color:#d2cadb;font-size:13px;line-height:1.55}.grid{display:grid;gap:14px;margin-top:18px}
.card{position:relative;overflow:hidden;min-height:190px;border-radius:25px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line);background:linear-gradient(145deg,#190b2a,#09050f);box-shadow:0 18px 50px rgba(0,0,0,.36);cursor:pointer}
.card.live{background:radial-gradient(circle at 78% 20%,rgba(222,59,255,.35),transparent 35%),linear-gradient(145deg,#240b35,#08040d)}.card.audio{background:radial-gradient(circle at 78% 20%,rgba(50,184,255,.30),transparent 35%),linear-gradient(145deg,#071b2c,#05080e)}
.card.games{background:radial-gradient(circle at 78% 20%,rgba(255,210,28,.22),transparent 35%),linear-gradient(145deg,#221700,#090703);opacity:.82}.badge{position:absolute;top:14px;left:14px;padding:6px 9px;border-radius:999px;font-size:9px;font-weight:900;border:1px solid currentColor;background:rgba(5,3,10,.72)}
.live .badge{color:#e765ff}.audio .badge{color:#55c9ff}.games .badge{color:var(--gold)}.symbol{position:absolute;right:18px;top:18px;font-size:55px;opacity:.18}.card h2{margin:0 0 6px;font-size:24px}.card p{margin:0 0 16px;color:#cfc7d8;font-size:12px;line-height:1.45;max-width:80%}
.action{align-self:flex-start;padding:11px 16px;border-radius:14px;font-weight:900;font-size:12px;color:white;background:linear-gradient(90deg,var(--purple2),#bf31ff)}.audio .action{background:linear-gradient(90deg,#075a92,#18a9ef)}.games .action{color:#796000;background:#ffe45d}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px max(8px,env(safe-area-inset-bottom));background:rgba(11,7,18,.98);border-top:1px solid var(--line);border-radius:24px 24px 0 0}
.nav{display:grid;justify-items:center;gap:4px;padding:7px 2px;color:#9f97aa;background:transparent;font-size:9px;font-weight:800;cursor:pointer}.nav svg{width:21px;height:21px}.nav.active{color:#fff}.nav.center{transform:translateY(-13px);width:60px;height:60px;border-radius:50%;justify-self:center;place-content:center;background:radial-gradient(circle at 35% 25%,#c24fff,#6215ef 58%,#25073d);border:2px solid #c64dff;box-shadow:0 0 26px rgba(166,42,255,.48)}.nav.center span{display:none}
.toast{position:fixed;left:50%;bottom:105px;transform:translate(-50%,20px);opacity:0;transition:.2s;width:min(calc(100% - 28px),480px);padding:12px 14px;border-radius:15px;background:#1a1026;border:1px solid var(--line);font-size:12px;font-weight:800}.toast.show{opacity:1;transform:translate(-50%,0)}

body{background:#05030a}.stage{min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#7e2cff 0 9%,#34124d 30%,#110719 68%,#05030a 100%)}
.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 28%,transparent 58%,rgba(0,0,0,.86))}.person{position:absolute;inset:15% 0 18%;display:grid;place-items:center}.face{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;font-size:78px;font-weight:950;background:linear-gradient(145deg,#8f34ff,#2b103d);border:4px solid rgba(255,255,255,.75);box-shadow:0 0 50px rgba(180,66,255,.45)}
.live-top{position:absolute;top:max(14px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;gap:9px;z-index:3}.back{width:42px;height:42px;border-radius:14px;background:rgba(9,5,15,.72);color:white;border:1px solid rgba(255,255,255,.16)}.host{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:16px;background:rgba(9,5,15,.68);border:1px solid rgba(255,255,255,.14)}.host-dot{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#7d27ef;font-weight:900}.host strong{display:block;font-size:11px}.host span{display:block;font-size:8px;color:#d4cadc}.follow{padding:8px 11px;border-radius:12px;background:var(--purple);color:#fff;font-size:10px;font-weight:900}.viewers{margin-left:auto;padding:8px 10px;border-radius:999px;background:rgba(9,5,15,.68);font-size:9px}
.side{position:absolute;right:12px;bottom:154px;display:grid;gap:10px;z-index:3}.float{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;background:rgba(17,9,28,.82);border:1px solid rgba(255,255,255,.15);color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.3)}.float span{font-size:8px;display:block}.chat{position:absolute;left:13px;right:76px;bottom:112px;z-index:3;display:grid;gap:7px}.msg{width:max-content;max-width:100%;padding:7px 9px;border-radius:12px;background:rgba(9,5,15,.64);font-size:10px}
.controls{position:absolute;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));z-index:4;display:grid;grid-template-columns:46px 1fr 46px;gap:9px}.controls input{height:48px;border-radius:16px;border:1px solid rgba(255,255,255,.16);background:rgba(9,5,15,.76);color:white;padding:0 14px;outline:none}.start{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);z-index:5;padding:14px 22px;border-radius:999px;background:linear-gradient(90deg,#7c1fff,#c733ff);color:#fff;font-weight:950;box-shadow:0 0 28px rgba(184,52,255,.5)}.panel{position:absolute;right:10px;bottom:205px;width:240px;padding:13px;border-radius:20px;background:rgba(15,8,24,.96);border:1px solid var(--line);z-index:8;display:none}.panel.show{display:block}.panel h3{margin:0 0 10px;font-size:14px}.gift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gift{padding:10px 5px;border-radius:12px;background:#241334;color:white;font-size:9px}
</style></head><body><div class="stage"><div class="live-top"><button class="back" onclick="location.href='salas.html'">←</button><div class="host"><div class="host-dot">L</div><div><strong>Luna</strong><span>Casa Padre · Nivel 12</span></div></div><button class="follow">Seguir</button><div class="viewers">1.2K</div></div><div class="person"><div class="face">L</div></div><button class="start" id="startBtn">Iniciar transmisión</button><div class="side"><button class="float" onclick="togglePanel()">🎁<span>Regalos</span></button><button class="float" onclick="showToast('Afortunados · sistema reservado')">🍀<span>Afortunados</span></button><button class="float" onclick="showToast('Lista de espectadores')">👥</button><button class="float" onclick="showToast('Compartir transmisión')">↗</button></div><div class="panel" id="giftPanel"><h3>Caja de regalos</h3><div class="gift-grid"><button class="gift">Corona<br>500</button><button class="gift">Estrella<br>100</button><button class="gift">Escudo<br>250</button><button class="gift">Rayo<br>80</button><button class="gift">Flor<br>50</button><button class="gift">JEMMO<br>1000</button></div></div><div class="chat"><div class="msg"><b style="color:#e96cff">Ruth:</b> ¡Vamos, Luna!</div><div class="msg"><b style="color:#ffd21c">Jesús:</b> Buena transmisión.</div><div class="msg"><b style="color:#55c9ff">Yandira:</b> Saludos desde Cuba.</div></div><div class="controls"><button class="float" onclick="showToast('Micrófono')">🎙</button><input placeholder="Escribe un mensaje..."><button class="float" onclick="showToast('Mensaje enviado')">➤</button></div><div class="toast" id="toast"></div></div>
<script>let timer;function showToast(x){const t=document.getElementById('toast');t.textContent=x;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),2200)}function togglePanel(){document.getElementById('giftPanel').classList.toggle('show')}document.getElementById('startBtn').onclick=function(){const a=this.dataset.active==='1';this.dataset.active=a?'0':'1';this.textContent=a?'Iniciar transmisión':'Finalizar transmisión';showToast(a?'Transmisión finalizada':'Transmisión iniciada · demostración')};</script></body></html>
