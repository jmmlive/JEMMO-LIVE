<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09000f"><title>YO · JEMMO LIVE</title><link rel="stylesheet" href="jemmo.css"><script>if(localStorage.getItem('jemmo_logged')!=='yes')location.replace('acceso.html');</script></head><body><div class="shell"><header class="top"><button class="iconbtn" onclick="back()"><svg class="ico" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div><h1>YO</h1><small>Tu perfil JEMMO</small></div><span class="pill"><span class="dot"></span>JEMMO</span></header><main class="content">
<section class="card" style="padding:20px;background:linear-gradient(145deg,#4d0b6c,#14021f)">
<div class="person-row"><div class="avatar" style="width:82px;height:82px"></div><div class="grow"><h2 id="nameTitle" style="margin:0"></h2><p id="userTitle" class="muted"></p><span class="pill">España</span></div><button class="action" onclick="toggleEdit()">✎</button></div>
<p id="bioTitle" class="muted" style="margin-top:18px"></p>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:16px"><div><b id="following"></b><small class="muted" style="display:block">Siguiendo</small></div><div><b>128</b><small class="muted" style="display:block">Seguidores</small></div><div><b id="coins"></b><small class="muted" style="display:block">Coins</small></div></div></section>
<section id="editBox" class="card stack" style="display:none;margin-top:12px"><input id="name" placeholder="Nombre"><input id="user" placeholder="@usuario"><textarea id="bio" rows="3" placeholder="Biografía"></textarea><input id="country" placeholder="País"><button class="btn" onclick="saveProfile()">GUARDAR</button></section>
<div class="section"><h2>Mi JEMMO</h2><span></span></div>
<section class="stack"><article class="card person-row" onclick="location.href='casa-demo.html'"><div class="avatar"></div><div class="grow"><b>Casa Padre</b><small>Mi Familia · 30 dentro</small></div><button class="action">›</button></article><article class="card person-row" onclick="toastMsg('Centro de ayuda JEMMO')"><div class="avatar"></div><div class="grow"><b>Ayuda y soporte</b><small>Funciones, seguridad y normas</small></div><button class="action">›</button></article><article class="card person-row" onclick="logout()"><div class="grow"><b>Cerrar sesión</b><small>Volver al acceso JEMMO</small></div><button class="action">›</button></article></section>

</nav><div class="toast" id="toast"></div><script src="jemmo.js"></script><script>
let s=getState();function draw(){nameTitle.textContent=s.profile.name;userTitle.textContent=s.profile.user;bioTitle.textContent=s.profile.bio;coins.textContent=s.coins;following.textContent=s.following;name.value=s.profile.name;user.value=s.profile.user;bio.value=s.profile.bio;country.value=s.profile.country}
function toggleEdit(){editBox.style.display=editBox.style.display==='none'?'grid':'none'}
function saveProfile(){s.profile={name:name.value.trim()||'Jesús',user:user.value.trim()||'@jesusjemmo',bio:bio.value.trim(),country:country.value.trim()};saveState(s);draw();toggleEdit();toastMsg('Perfil guardado')}
function logout(){localStorage.removeItem('jemmo_logged');location.href='acceso.html'} draw();
</script></body></html>
