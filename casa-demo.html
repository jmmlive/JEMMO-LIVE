<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050008"><title>CASA JEMMO | JEMMO LIVE</title><link rel="stylesheet" href="jemmo.css"></head><body><main class="app"><div data-top="CASA JEMMO"></div>
<div class="wrap"><section class="card hero"><div class="eyebrow">CASA VISITANTE</div><h1 id="name"></h1><p id="meta"></p><div class="actions"><button class="btn primary" onclick="J.toast('🔔 Solicitud enviada al administrador de esta Casa')">PEDIR SUBIR</button><button class="btn soft" onclick="location.href='ascensor.html'">VOLVER AL ASCENSOR</button></div></section><section id="seats" class="card seats" style="margin-top:15px"></section></div>
<script>const q=new URLSearchParams(location.search),n=q.get('casa')||'Casa JEMMO',lv=q.get('nivel')||1,ic=q.get('icon')||'🏠';name.textContent=ic+' '+n;meta.textContent='Nivel '+lv+' · Sala central persistente';for(let i=0;i<16;i++){const f=i<5;seats.innerHTML+=`<button class="seat ${f?'filled':''}" onclick="J.toast('${f?'Miembro de Casa':'Solicitud para subir'}')"><small>${f?(i===0?'CREADOR':i===1?'ADMIN':'CASA'):'LIBRE'}</small><span class="av">${f?ic:'+'}</span><b>${f?'Miembro':'Pedir subir'}</b></button>`}</script></main><div data-nav="casa"></div><div id="toast" class="toast"></div><script src="jemmo.js"></script></body></html>
