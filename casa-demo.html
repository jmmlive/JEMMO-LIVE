<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#08000d"><title>Casa JEMMO</title><style>
*{box-sizing:border-box}:root{--g:#ffd84d}html,body{margin:0;height:100%;overflow:hidden;background:#050008;color:white;font-family:Arial,sans-serif}.app{height:100dvh;max-width:720px;margin:auto;position:relative;background:radial-gradient(circle at 50% 20%,#39075b,#0b0113 48%,#050008)}button{font:inherit}.top{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;gap:10px}.back{width:44px;height:44px;border:1px solid #7c5420;border-radius:14px;background:#170322;color:var(--g);font-size:22px}.title{flex:1;text-align:center}.title h1{font-size:22px;margin:0;text-shadow:0 0 15px #a823ff}.title p{margin:4px 0;color:var(--g);font-size:10px;letter-spacing:1px}.seats{position:absolute;left:6%;right:6%;top:17%;height:58%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:6px}.seat{border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}.av{width:48px;height:48px;border-radius:50%;border:1px dashed #fff7;background:#ffffff0a;display:grid;place-items:center;font-size:21px;box-shadow:0 0 14px #a828ff33}.filled .av{border:2px solid var(--g);background:radial-gradient(circle,#d954ff,#6810a0 60%,#200332)}.seat small{color:var(--g);font-size:8px;margin-bottom:3px}.seat b{font-size:9px;margin-top:4px}.bottom{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));height:20%;border:1px solid #79269b;border-radius:22px;background:#10021bdd;padding:12px}.bottom h3{font-size:13px;margin:0 0 6px;color:var(--g)}.bottom p{font-size:11px;color:#d7c4df;margin:0 0 10px}.req{width:100%;padding:12px;border:0;border-radius:14px;background:linear-gradient(90deg,#7b13bd,#c52eff);color:#fff;font-weight:900}.toast{position:absolute;z-index:20;top:45%;left:50%;transform:translate(-50%,-50%);display:none;width:80%;padding:15px;border:1px solid var(--g);border-radius:16px;background:#140220;text-align:center}.toast.show{display:block}
</style></head><body><main class="app"><header class="top"><button class="back" onclick="location.href='ascensor.html'">‹</button><div class="title"><h1 id="name">CASA JEMMO</h1><p id="meta"></p></div></header><section class="seats" id="seats"></section><section class="bottom"><h3>VISITANTE DE LA CASA</h3><p>Los miembros suben directamente. Los visitantes necesitan permiso de un administrador.</p><button class="req" onclick="requestSeat()">🔔 PEDIR SUBIR A UNA SILLA</button></section><div class="toast" id="toast"></div></main><script>
const q=new URLSearchParams(location.search),name=q.get('casa')||'Casa JEMMO',level=q.get('nivel')||'1',icon=q.get('icon')||'🏠';document.getElementById('name').textContent=icon+' '+name.toUpperCase();document.getElementById('meta').textContent='NIVEL '+level+' · ID FICTICIA #'+String(level).padStart(6,'0');const people=['Líder','Admin','Miembro','Miembro','Miembro'];const seats=document.getElementById('seats');for(let i=0;i<16;i++){let full=i<people.length;seats.innerHTML+=`<button class="seat ${full?'filled':''}" onclick="${full?`toast('${people[i]} · asiento ${i+1}')`:'requestSeat()'}"><small>${full?(i===0?'LÍDER':i===1?'ADMIN':'CASA'):'LIBRE'}</small><span class="av">${full?icon:'+'}</span><b>${full?people[i]:'Pedir subir'}</b></button>`}function requestSeat(){toast('🔔 Solicitud enviada · esperando permiso del administrador')}function toast(x){const t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
</script></body></html>
