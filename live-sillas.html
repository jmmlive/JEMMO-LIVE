<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05030a"><title>JEMMO LIVE · LIVE con sillas</title><style>
:root{--purple:#a62cff;--gold:#ffd21c;--white:#faf8ff;--muted:#aea6b9;--line:rgba(184,76,255,.34);--green:#2de789;--red:#ff4b62;--shadow:0 22px 65px rgba(0,0,0,.55)}*{box-sizing:border-box}body{margin:0;background:#05030a;color:var(--white);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;border:0;cursor:pointer}.stage{min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 28%,#5f20a1 0 7%,#241033 34%,#08040d 76%)}.live-top{position:relative;z-index:8;display:flex;align-items:center;gap:8px;padding:14px}.icon{width:43px;height:43px;border-radius:15px;background:rgba(18,10,29,.9);border:1px solid var(--line);color:#fff}.pill{padding:8px 10px;border-radius:999px;background:rgba(9,5,15,.76);border:1px solid var(--line);font-size:10px;font-weight:900}.pill.live{color:#ff7084}.seat-grid{position:absolute;left:10px;right:10px;top:76px;bottom:105px;z-index:3;display:grid;gap:7px;align-content:center}.seat-grid.n4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.seat-grid.n8{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.seat-grid.n12{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}.seat-grid.n16{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}.seat{position:relative;min-width:0;min-height:0;overflow:hidden;border-radius:16px;background:linear-gradient(145deg,#241334,#0d0714);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5px;color:#fff}.seat.host{border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,28,.18)}.seat video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#08040d}.video-shade{position:absolute;inset:auto 0 0;padding:20px 5px 6px;background:linear-gradient(transparent,rgba(0,0,0,.84));z-index:2}.seat b,.seat small{position:relative;z-index:2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.seat b{font-size:clamp(9px,2.8vw,12px)}.seat small{font-size:clamp(7px,2.1vw,9px);color:#d2cadb;margin-top:2px}.avatar{width:clamp(34px,10vw,48px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#9e35ff,#50148b);font-weight:950;font-size:15px}.status-light{position:absolute;right:6px;top:6px;z-index:4;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 9px rgba(45,231,137,.75)}.status-light.done{background:var(--red);box-shadow:0 0 9px rgba(255,75,98,.75)}.end-btn{position:absolute;left:50%;bottom:27px;transform:translateX(-50%);z-index:7;padding:13px 22px;border-radius:999px;background:linear-gradient(90deg,#b11d3d,#ff4b62);color:#fff;font-weight:950}.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,18px);z-index:200;padding:10px 13px;border-radius:13px;background:#1b1028;border:1px solid var(--line);opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;font-size:11px}.toast.show{opacity:1;transform:translate(-50%,0)}.sheet-bg,.modal-bg{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.72);display:none;place-items:end center}.sheet-bg.show,.modal-bg.show{display:grid}.sheet,.modal{width:min(100%,520px);padding:16px 14px 25px;border-radius:28px 28px 0 0;background:#120a1d;border:1px solid var(--line)}.sheet-handle{width:42px;height:4px;border-radius:9px;background:#5d5366;margin:0 auto 13px}.sheet h3,.modal h3{margin:0 0 4px}.sheet p{margin:0 0 12px;color:var(--muted);font-size:11px}.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sheet-actions button{padding:12px;border-radius:14px;background:#251337;color:#fff;text-align:left;font-weight:850}.sheet-actions .danger{background:#351019;color:#ff9aaa}.summary-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:12px}.primary,.secondary{width:100%;margin-top:11px;padding:13px;border-radius:15px;color:#fff;font-weight:900}.primary{background:linear-gradient(90deg,#711cff,#c532ff)}.secondary{background:#1b1127;border:1px solid var(--line)}@media(max-width:390px){.seat-grid{gap:5px;left:6px;right:6px}.seat{border-radius:13px;padding:3px}.seat-grid.n12,.seat-grid.n16{top:72px;bottom:96px}.avatar{width:31px}.sheet-actions{grid-template-columns:1fr}}
</style></head><body><div class="stage"><div class="live-top"><button class="icon" onclick="finish()">←</button><span class="pill live">● LIVE CON SILLAS</span><span class="pill" id="timer">00:00</span><button class="icon" style="margin-left:auto" onclick="showToast('Herramientas de sala')">⋮</button></div><div class="seat-grid" id="grid"></div><button class="end-btn" onclick="finish()">Finalizar reunión</button><div class="toast" id="toast"></div></div><div class="sheet-bg" id="seatSheet" onclick="closeSheet(event)"><div class="sheet"><div class="sheet-handle"></div><h3 id="sheetTitle">Gestionar silla</h3><p id="sheetSub">Selecciona una acción</p><div class="sheet-actions"><button onclick="seatAction('down')">Bajar de la silla</button><button onclick="seatAction('mute')">Silenciar micrófono</button><button onclick="seatAction('admin')">Dar administración</button><button onclick="seatAction('invite')">Invitar a esta silla</button><button class="danger" onclick="seatAction('kick')">Expulsar 20 minutos</button><button onclick="hideSheet()">Cancelar</button></div></div></div><div class="modal-bg" id="summary"><div class="modal"><h3>Resumen del LIVE con sillas</h3><div class="summary-row"><span>Duración</span><b id="sumTime"></b></div><div class="summary-row"><span>Plazas configuradas</span><b id="sumSeats"></b></div><div class="summary-row"><span>Estado de cámara</span><b id="sumCamera"></b></div><button class="primary" onclick="location.href='index.html'">Volver al Inicio</button><button class="secondary" onclick="location.href='salas.html'">Volver a Salas</button></div></div><script>
let toastTimer,secs=0,stream=null,selectedIndex=-1,selectedSeat=null;const cfg=JSON.parse(localStorage.getItem('jemmoConfig_live_sillas')||'{"seats":4}');const n=[4,8,12,16].includes(Number(cfg.seats))?Number(cfg.seats):4;function showToast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2200)}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}setInterval(()=>{secs++;document.getElementById('timer').textContent=fmt(secs)},1000);const grid=document.getElementById('grid');grid.className='seat-grid n'+n;for(let i=0;i<n;i++){const s=document.createElement('button');s.className='seat '+(i===0?'host':'');if(i===0){s.innerHTML='<video id="hostVideo" autoplay muted playsinline></video><i class="status-light"></i><div class="video-shade"><b>Jesús</b><small>Anfitrión</small></div>';s.onclick=()=>showToast('Esta es tu cámara principal')}else{s.innerHTML=`<i class="status-light${i===2?' done':''}"></i><div class="avatar">${i<4?String.fromCharCode(82+i):'+'}</div><b>${i<4?'Invitado '+i:'Silla '+(i+1)}</b><small>${i<4?'Tarea de silla':'Tocar para invitar'}</small>`;s.onclick=()=>openSheet(i,s)}grid.appendChild(s)}async function startMedia(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});const v=document.getElementById('hostVideo');v.srcObject=stream;await v.play().catch(()=>{});showToast('Cámara y micrófono activos')}catch(e){showToast('No se pudo abrir la cámara. Revisa los permisos')}}function openSheet(i,s){selectedIndex=i;selectedSeat=s;document.getElementById('sheetTitle').textContent='Silla '+(i+1);document.getElementById('sheetSub').textContent=s.querySelector('b')?.textContent||'Selecciona una acción';document.getElementById('seatSheet').classList.add('show')}function hideSheet(){document.getElementById('seatSheet').classList.remove('show')}function closeSheet(e){if(e.target.id==='seatSheet')hideSheet()}function seatAction(action){if(!selectedSeat)return;const name=selectedSeat.querySelector('b')?.textContent||'Invitado';if(action==='down'){selectedSeat.innerHTML='<div class="avatar">+</div><b>Silla libre</b><small>Tocar para invitar</small>';showToast(name+' bajado de la silla')}if(action==='mute')showToast(name+' silenciado');if(action==='admin')showToast('Administración concedida');if(action==='invite')showToast('Invitación enviada a la silla '+(selectedIndex+1));if(action==='kick'){selectedSeat.innerHTML='<div class="avatar">×</div><b>Bloqueado</b><small>20 minutos</small>';showToast(name+' expulsado 20 minutos')}hideSheet()}function finish(){if(stream)stream.getTracks().forEach(t=>t.stop());document.getElementById('sumTime').textContent=fmt(secs);document.getElementById('sumSeats').textContent=n;document.getElementById('sumCamera').textContent=stream?'Activa':'Sin permiso';document.getElementById('summary').classList.add('show')}startMedia();</script></body></html>
