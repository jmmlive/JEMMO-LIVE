<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050008"><title>MENSAJES | JEMMO LIVE</title><link rel="stylesheet" href="jemmo.css"></head><body><main class="app"><div data-top="MENSAJES"></div>
<div class="wrap"><div class="list"><button class="row" onclick="openChat('Ruth')"><span class="ico">🇨🇺</span><span class="grow"><b>Ruth</b><small>¿Qué bolá? Vi el evento de la Casa.</small></span><span class="arrow">›</span></button><button class="row" onclick="openChat('Yandira')"><span class="ico">💜</span><span class="grow"><b>Yandira</b><small>Te mandé una invitación.</small></span><span class="arrow">›</span></button></div><section id="panel" class="card" style="margin-top:14px" hidden><div id="chat" class="chatbox"></div><form class="chat-input" onsubmit="send(event)"><input id="text" maxlength="300" placeholder="Mensaje..."><button>➤</button></form><div class="actions" style="padding:0 10px 12px"><button class="btn soft" onclick="translateLast()">TRADUCIR ÚLTIMO</button><button class="btn danger" onclick="location.href='reportar.html?tipo=chat'">REPORTAR</button></div></section></div>
<script>let who='';function openChat(n){who=n;panel.hidden=false;chat.innerHTML=`<div class="msg">${n}: Hola 👋 Este mensaje puede ofrecer traducción discreta.</div>`}function send(e){e.preventDefault();if(!text.value.trim())return;chat.innerHTML+=`<div class="msg me">${text.value.replace(/</g,'&lt;')}</div>`;text.value='';chat.scrollTop=chat.scrollHeight}function translateLast(){J.toast('🌍 Demo de interfaz: la traducción real requerirá un servicio de traducción conectado al servidor.')}</script></main><div data-nav="chat"></div><div id="toast" class="toast"></div><script src="jemmo.js"></script></body></html>
